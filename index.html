<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM Explorer</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1d2129; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#8a92a6; --accent:#6ea8fe; --accent-2:#4f7dd6;
    --amber:#f0b429; --green:#3fb950; --red:#f85149; --purple:#a371f7;
    --radius:8px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:18px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .app { display:grid; height:100vh;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "left center" "bottom bottom"; }

  /* ---- Top ---- */
  .topbar { grid-area: top; display:flex; align-items:flex-end; gap:8px;
    padding:6px 10px 0; border-bottom:1px solid var(--border); background:var(--panel);
    position:relative; }

  .tabs { display:flex; gap:3px; flex:1; overflow-x:auto; }
  .tab { padding:8px 14px; border:1px solid transparent; border-bottom:none;
    border-radius:6px 6px 0 0; background:transparent; color:var(--muted);
    cursor:pointer; font-size:18px; white-space:nowrap; font-family:inherit; }
  .tab.active { background:var(--bg); color:var(--text); border-color:var(--border); }
  .branch-pill, .legend-pill { font-size:16px; color:var(--muted); padding:6px 11px;
    border:1px solid var(--border); border-radius:6px; cursor:pointer;
    white-space:nowrap; margin-bottom:4px; background:transparent; font:inherit; }
  .branch-pill:hover, .legend-pill:hover { border-color:var(--accent); color:var(--text); }
  .legend-pill.open { border-color:var(--accent); color:var(--text); }

  .legend-drop { position:absolute; top:calc(100% + 4px); right:60px;
    background:var(--panel-2); border:1px solid var(--accent);
    border-radius:10px; padding:14px; width:380px;
    box-shadow:0 12px 40px rgba(0,0,0,.7); z-index:50;
    display:none; font-size:16px; }
  .legend-drop.open { display:block; }
  .legend-drop .ld-head { display:flex; align-items:center; gap:6px;
    font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:8px; }
  .legend-drop .ld-head .spacer { flex:1; }
  .legend-drop .ctx-switch { display:flex; gap:3px; margin-bottom:10px; }
  .legend-drop .ctx-switch button { flex:1; padding:6px 8px; font-size:14px;
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    color:var(--muted); cursor:pointer; }
  .legend-drop .ctx-switch button.active { color:var(--text); border-color:var(--accent); }
  .legend-drop .legend-list { display:flex; flex-direction:column; gap:8px;
    max-height:400px; overflow-y:auto; }
  .legend-drop .legend-item { display:flex; gap:10px; align-items:flex-start; }
  .legend-drop .legend-item .ico { min-width:28px; font-size:20px; text-align:center; }
  .legend-drop .legend-item .txt { color:var(--muted); line-height:1.4; }

  /* ---- Left ---- */
  .leftbar { grid-area: left; border-right:1px solid var(--border);
    background:var(--panel); padding:12px; overflow-y:auto;
    display:flex; flex-direction:column; gap:12px; }
  .lb-section { font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:2px 0; font-weight:600; }
  .master-slider { background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; }
  .master-slider .head { display:flex; align-items:center; gap:8px;
    margin-bottom:8px; }
  .master-slider .label { font-size:15px; color:var(--muted); font-weight:500; }
  .master-slider .head .spacer { flex:1; }
  .master-delta { font-size:13px; font-weight:600; color:var(--muted);
    font-variant-numeric:tabular-nums; min-width:34px; }
  .master-delta.up { color:var(--amber); }
  .master-delta.down { color:var(--accent); }

  .slider-row { display:flex; align-items:center; gap:8px; width:100%; }
  .slider-row input[type="range"] { flex:1; accent-color:var(--amber);
    height:6px; cursor:pointer; margin:0; }
  .slider-row input[type="range"]:disabled { opacity:.45; cursor:not-allowed; }

  .lock-btn { background:transparent; border:1px solid transparent;
    color:var(--muted); cursor:pointer; padding:2px 6px;
    border-radius:4px; font-size:17px; opacity:.4; line-height:1;
    transition:all .15s ease; }
  .lock-btn:hover { background:rgba(255,255,255,.08); opacity:.85; }
  .lock-btn.on { opacity:1; border-color:var(--accent);
    filter:drop-shadow(0 0 4px var(--accent)); color:#fff; }

  .trio-toggle { display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); cursor:pointer; font-size:15px; user-select:none; }
  .trio-toggle:hover { border-color:var(--green); }
  .trio-toggle.on { border-color:var(--green); color:var(--green); }
  .trio-toggle .sw { width:36px; height:20px; border-radius:12px;
    background:var(--border); position:relative; transition:background .15s; flex-shrink:0; }
  .trio-toggle.on .sw { background:var(--green); }
  .trio-toggle .sw::after { content:''; position:absolute; top:2px; left:2px;
    width:16px; height:16px; border-radius:50%; background:#fff;
    transition:transform .15s; }
  .trio-toggle.on .sw::after { transform:translateX(16px); }

  .llm-list-container { display:flex; flex-direction:column; gap:10px; }

  .llm-row { padding:10px 12px; border:1px solid var(--border); background:var(--panel-2);
    border-radius:8px; display:flex; flex-direction:column; gap:8px;
    cursor:pointer; transition:border-color .15s, background .15s, box-shadow .15s;
    user-select:none; position:relative; }
  .llm-row:hover { border-color:var(--accent); }
  .llm-row.off { opacity:.45; }
  .llm-row.static-row { gap:0; }

  /* Visual heat: cool blue -> warm orange -> glowing gold.
     --heat-rgb / --heat-a / --heat-border-a / --heat-glow are set per row
     from the model's current slider value in applyHeat(). */
  .llm-row.heat-row {
    border-color: rgba(var(--heat-rgb, 74, 158, 255), var(--heat-border-a, .3));
    background: linear-gradient(100deg,
      rgba(var(--heat-rgb, 74, 158, 255), var(--heat-a, .04)) 0%,
      var(--panel-2) 78%);
    box-shadow:
      0 0 calc(var(--heat-glow, 0) * 1px) rgba(var(--heat-rgb, 74, 158, 255), .45),
      inset 0 0 calc(var(--heat-glow, 0) * .6px) rgba(var(--heat-rgb, 74, 158, 255), .18);
  }
  .llm-row.heat-row:hover {
    border-color: rgba(var(--heat-rgb, 74, 158, 255), 1);
  }

  /* Drag feedback is declared after the heat rules so it wins the cascade:
     .llm-row.heat-row would otherwise override the drag border/glow. */
  .llm-row.dragging { opacity:.35; border:1px dashed var(--accent); }
  .llm-row.drag-over { border-color:var(--accent);
    box-shadow:0 -2px 0 0 var(--accent), 0 0 0 1px var(--accent) inset; }

  .llm-head { display:flex; align-items:center; gap:8px; font-size:17px; }
  .grab-handle { cursor:grab; color:var(--muted); font-size:16px; user-select:none;
    padding:0 4px 0 0; display:inline-flex; align-items:center; line-height:1; opacity:.6; }
  .grab-handle:hover { opacity:1; color:var(--text); }
  .grab-handle:active { cursor:grabbing; }

  .llm-head input[type="checkbox"] { accent-color:var(--accent);
    margin:0; width:22px; height:22px; cursor:pointer; flex-shrink:0; }
  .llm-emoji { font-size:19px; }
  .llm-name { flex:1; font-weight:600; font-size:16px; }

  /* Prefixes Row */
  .prefix-row { display:flex; align-items:center; gap:6px; padding-top:4px;
    border-top:1px dashed var(--border); }
  .prefix-label { font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; font-weight:500; }
  .prefix-select { flex:1; background:var(--bg); border:1px solid var(--border);
    border-radius:4px; color:var(--text); font-size:13px; padding:3px 6px;
    outline:none; cursor:pointer; font-family:inherit; }
  .prefix-select:focus { border-color:var(--accent); }
  .prefix-edit-btn { background:transparent; border:1px solid var(--border);
    border-radius:4px; color:var(--text); cursor:pointer; padding:2px 6px;
    font-size:13px; line-height:1.2; font-family:inherit; }
  .prefix-edit-btn:hover { border-color:var(--accent); background:rgba(255,255,255,.06); }
  .prefix-preview { font-size:12px; color:var(--muted); font-style:italic;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px; }

  /* ---- Center ---- */
  .center { grid-area: center; overflow-y:auto; padding:20px 28px; }
  .wrap { max-width:950px; margin:0 auto; }
  .turn { margin-bottom:24px; border-left:2px solid transparent; padding-left:14px; }
  .turn.in-ctx { border-left-color:var(--accent); }

  .turn-head { display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:12px; font-size:15px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    user-select:none; padding:6px 0; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border); }
  .turn-head:hover { color:var(--text); }
  .turn-head .tnum { color:var(--accent); font-weight:600; }
  .turn-head .log-btn { background:transparent; border:none; color:var(--muted);
    cursor:pointer; padding:2px 6px; border-radius:4px; font-size:16px; }

  .prompt-card { padding:12px 14px; border-radius:var(--radius);
    background:#141821; border:1px solid var(--border); font-size:18px;
    margin-bottom:12px; white-space:pre-wrap; word-wrap:break-word; }
  .prompt-card .who { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }

  .hybrid-card { border-radius:var(--radius); background:#161e2e;
    border:1px solid #2a3d5c; overflow:hidden; margin-bottom:8px; }
  .hybrid-label { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent); padding:8px 14px 0 14px; }
  .hybrid-body { padding:6px 14px 12px 14px; font-size:18px;
    white-space:pre-wrap; word-wrap:break-word; }

  .score-bar { padding:10px 14px; font-size:16px; cursor:pointer;
    background:rgba(63,185,80,.09); color:var(--green);
    border-top:1px solid var(--border);
    display:flex; gap:8px; align-items:flex-start; }
  .score-bar.mid { background:rgba(240,180,41,.09); color:var(--amber); }
  .score-bar.low { background:rgba(248,81,73,.09); color:var(--red); }
  .score-bar .pct { font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums; min-width:60px; }
  .score-bar .reason { flex:1; color:var(--muted); font-weight:400;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score-bar.open .reason { white-space:normal; }

  .source-bar { display:flex; align-items:center; gap:8px; padding:8px 12px;
    border-top:1px solid var(--border); background:rgba(0,0,0,.15);
    cursor:pointer; user-select:none; flex-wrap:wrap; }
  .source-bar:hover { background:rgba(255,255,255,.03); }
  .src-emoji { background:var(--panel); border:1px solid var(--border);
    color:var(--text); cursor:pointer; padding:5px 10px; font-size:17px;
    border-radius:6px; font-family:inherit; }
  .src-emoji:hover { border-color:var(--accent); }
  .src-emoji.on { border-color:var(--accent); background:#1a2130;
    box-shadow:0 0 0 1px var(--accent) inset; }
  .src-emoji.omitted { opacity:.45; }
  .source-bar .spacer { flex:1; }
  .source-bar .bar-act { background:transparent; border:1px solid var(--border);
    color:var(--muted); cursor:pointer; padding:5px 10px; font-size:15px;
    border-radius:5px; font-family:inherit; }
  .source-bar .bar-act:hover { color:var(--text); border-color:var(--accent); }

  .src-reply { display:none; border-top:1px solid var(--border);
    background:var(--panel); padding:12px 14px; font-size:18px;
    white-space:pre-wrap; word-wrap:break-word; }
  .src-reply.open { display:block; }
  .src-reply .src-head { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
    display:flex; gap:8px; align-items:center; }
  .src-reply .src-head .time { color:var(--muted); font-size:14px;
    text-transform:none; letter-spacing:0; }
  .src-reply .src-head .pct { margin-left:auto; color:var(--green);
    font-weight:600; font-variant-numeric:tabular-nums; }
  .src-reply .src-head .pct.mid { color:var(--amber); }
  .src-reply .src-head .pct.low { color:var(--red); }
  .src-reply .src-reason { font-size:14px; color:var(--muted);
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }

  /* ---- Bottom ---- */
  .bottom { grid-area: bottom; border-top:1px solid var(--border);
    background:var(--panel); padding:12px 16px;
    display:flex; flex-direction:column; gap:8px; }
  .bottom-inner { max-width:950px; margin:0 auto; width:100%;
    display:flex; flex-direction:column; gap:8px; }

  .history { background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px;
    display:flex; flex-direction:column; gap:8px; }
  .hs-head { display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--muted); letter-spacing:.08em;
    text-transform:uppercase; }
  .hs-head .spacer { flex:1; }
  .hs-head .meta { font-variant-numeric:tabular-nums; color:var(--accent);
    letter-spacing:0; text-transform:none; font-size:15px; }
  .hs-row { display:flex; align-items:center; gap:10px; }
  .hs-preview { flex:1; min-width:0; font-size:16px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hs-preview strong { color:var(--text); font-weight:600; }
  .hs-track { flex:0 0 260px; }
  .hs-track input[type="range"] { width:100%; accent-color:var(--amber);
    height:6px; cursor:pointer; }
  .hs-stats { display:flex; gap:16px; font-size:15px; color:var(--muted);
    font-variant-numeric:tabular-nums; }
  .hs-stats strong { color:var(--text); font-weight:600; }

  #masterText { width:100%; min-height:60px; max-height:160px; resize:vertical;
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; font:inherit;
    font-size:18px; outline:none; }
  #masterText:focus { border-color:var(--accent); }

  .toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:6px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 12px; font-size:18px; line-height:1; display:flex; align-items:center; gap:6px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent-2); border-color:var(--accent-2); color:#fff; }
  button.toggle { opacity:.45; }
  button.toggle.on { opacity:1; border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset; }
  button.free.on { border-color:var(--green); color:var(--green);
    box-shadow:0 0 0 1px var(--green) inset; }
  .btn-label { font-size:14px; font-weight:500; }

  .engine-picker { display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; }
  .engine-picker:focus-within { border-color:var(--accent); }
  .engine-picker .engine-label { color:var(--muted); font-size:13px;
    text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
  .engine-picker select { background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:4px; padding:4px 6px;
    font:inherit; font-size:14px; cursor:pointer; outline:none; }
  .engine-picker select:focus { border-color:var(--accent); }

  .add-custom-btn { width:100%; justify-content:center;
    border-style:dashed; color:var(--accent); background:transparent;
    font-size:15px; padding:9px 10px; }
  .add-custom-btn:hover { background:rgba(110,168,254,.08); }
  .model-badge { font-size:10px; font-weight:700; letter-spacing:.06em;
    color:var(--purple); border:1px solid var(--purple); border-radius:4px;
    padding:1px 4px; line-height:1.2; text-transform:uppercase; }

  .statusbar { display:flex; gap:12px; padding:8px 10px; font-size:15px;
    background:#0b0d11; border:1px solid var(--border); border-radius:6px;
    font-variant-numeric:tabular-nums; min-height:32px; align-items:center; }
  .sb-prompt { color:var(--accent); font-weight:600; white-space:nowrap; }
  .sb-timer { color:var(--amber); white-space:nowrap; font-weight:600; }
  .sb-timer.done { color:var(--green); }
  .sb-status { color:var(--muted); white-space:nowrap; }
  .sb-progress { flex:1; height:4px; background:var(--border); border-radius:2px;
    overflow:hidden; min-width:60px; position:relative; }
  .sb-progress .fill { position:absolute; inset:0 auto 0 0;
    background:linear-gradient(90deg, var(--amber), var(--accent));
    transition:width .5s linear; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2a2f3a; border-radius:10px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="tabs" id="tabs"></div>
    <button id="loginBtn" onclick="window.api?.startLoginMode?.()" style="padding: 8px 12px; background: #2196F3; color: white; border: none; border-radius: 6px; margin-right: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">🔐 Login Mode</button>
    <button id="newChatBtn" onclick="clearChat()" style="padding: 8px 12px; background: #f44336; color: white; border: none; border-radius: 6px; margin-right: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">🗑️ New Chat</button>
    <button class="legend-pill" id="legendPill">📖 Legend ▾</button>
    <button class="branch-pill">🌿 Branch ▾</button>
    
    <div class="legend-drop" id="legendDrop">
      <div class="ld-head"><span>📖 Legend</span><span class="spacer"></span>
        <span id="ctxPill" style="color:var(--muted);text-transform:none;letter-spacing:0;font-size:15px">idle</span>
      </div>
      <div class="ctx-switch" id="ctxSwitch">
        <button data-ctx="idle" class="active">UI Overview</button>
        <button data-ctx="reply">Reply Tools</button>
        <button data-ctx="summary">Free Bench</button>
      </div>
      <div class="legend-list" id="legendBody"></div>
    </div>
  </div>

  <div class="leftbar">
    <div class="lb-section">Detail & Heat</div>
    <div class="master-slider">
      <div class="head">
        <span class="label">Master Slider</span>
        <span class="master-delta" id="masterDelta">±0</span>
        <span class="spacer"></span>
        <button class="lock-btn" id="masterLock" title="Master Lock OFF: individual locks respected"
          aria-label="Master lock" aria-pressed="false">🔓</button>
      </div>
      <div class="slider-row">
        <input type="range" id="masterSlider" min="-100" max="100" step="1" value="0"
          aria-label="Master relative adjustment">
      </div>
    </div>
    <div class="trio-toggle" id="trioToggle">
      <div class="sw"></div>
      <span>Max Heat for DeepSeek, Perplexity, Meta</span>
    </div>
    <div class="lb-section">Models</div>
    <div id="llmList" class="llm-list-container"></div>
  </div>

  <div class="center">
    <div class="wrap" id="convWrap"></div>
  </div>

  <div class="bottom">
    <div class="bottom-inner">
      <div class="history">
        <div class="hs-head">
          <span>📜 History Context</span><span class="spacer"></span>
          <span class="meta" id="hsMeta">0 of 0 turns included</span>
        </div>
        <div class="hs-row">
          <div class="hs-preview" id="hsPreview"></div>
          <div class="hs-track">
            <input type="range" id="hsRange" min="0" max="2" value="0">
          </div>
        </div>
        <div class="hs-stats">
          <span>Depth: <strong id="hsDepth">0 turns</strong></span>
          <span>Est. Context: <strong id="hsTok">0 tok</strong></span>
          <span>Est. Time: <strong id="hsNext">~0.0s</strong></span>
        </div>
      </div>

      <textarea id="masterText" placeholder="Type a prompt here and hit Send..."></textarea>

      <div class="toolbar">
        <button class="primary" id="sendBtn">⚡ <span class="btn-label">Send</span></button>
        <label class="engine-picker" title="Synthesis engine">
          <span class="engine-label">Engine</span>
          <select id="engineToggle" aria-label="Synthesis engine">
            <option value="Local GPU" selected>Local GPU</option>
            <option value="Cloud">Cloud API (DeepSeek)</option>
          </select>
        </label>
        <button id="retryBtn">🔄 <span class="btn-label">Retry</span></button>
        <button id="syncBtn">Sync <span class="btn-label">View</span></button>
        <button class="toggle on" id="prefixToggleBtn">✨ <span class="btn-label">Prefix</span></button>
        <button id="hybridBtn">🪟 <span class="btn-label">Hybrid</span></button>
        <button class="toggle free" id="freeBtn">🆓 <span class="btn-label">Free APIs</span></button>
        <button id="settingsBtn">⚙ <span class="btn-label">Settings</span></button>
      </div>

      <div class="statusbar">
        <span class="sb-prompt" id="sbPrompt">✎ Master</span>
        <span class="sb-timer" id="sbTimer">est. next send: ~4.8s</span>
        <span class="sb-status" id="sbStatus">idle</span>
        <div class="sb-progress" id="sbProgress" style="display:none">
          <div class="fill" id="sbFill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // --- PREFIX PRESETS ---
  const PREFIX_PRESETS = {
    'Concise': 'Be concise, direct, and avoid preamble.',
    'Detailed': 'Provide a detailed, comprehensive response with examples.',
    'ELI5': "Explain like I'm 5 years old. Use simple language and relatable analogies."
  };

  // --- MODEL CHANNELS CONFIGURATION ---
  const CH = [
    { id:'brave',      emoji:'🦁', name:'Brave',      checked:true,  isStatic:true,  tps:100, ttft:0.5 },
    { id:'google',     emoji:'🔍', name:'Google AI',  checked:true,  isStatic:true,  tps:100, ttft:0.5 },
    { id:'chatgpt',    emoji:'🤖', name:'ChatGPT',    checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Concise',  customPrefix:'', prefix:PREFIX_PRESETS['Concise'],  tps:80,  ttft:0.4 },
    { id:'claude',     emoji:'🎭', name:'Claude',     checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Concise',  customPrefix:'', prefix:PREFIX_PRESETS['Concise'],  tps:75,  ttft:0.4 },
    { id:'gemini',     emoji:'♊', name:'Gemini',     checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Detailed', customPrefix:'', prefix:PREFIX_PRESETS['Detailed'], tps:195, ttft:0.5 },
    { id:'deepseek',   emoji:'🌊', name:'DeepSeek',   checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Detailed', customPrefix:'', prefix:PREFIX_PRESETS['Detailed'], tps:110, ttft:0.4 },
    { id:'grok',       emoji:'🌌', name:'Grok',       checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Concise',  customPrefix:'', prefix:PREFIX_PRESETS['Concise'],  tps:90,  ttft:0.5 },
    { id:'meta',       emoji:'💠', name:'Meta AI',    checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Concise',  customPrefix:'', prefix:PREFIX_PRESETS['Concise'],  tps:85,  ttft:0.5 },
    { id:'copilot',    emoji:'🛩️', name:'Copilot',    checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Detailed', customPrefix:'', prefix:PREFIX_PRESETS['Detailed'], tps:70,  ttft:0.6 },
    { id:'perplexity', emoji:'🔭', name:'Perplexity', checked:false, isStatic:false, value:50, baseValue:50, locked:false, prefixType:'Detailed', customPrefix:'', prefix:PREFIX_PRESETS['Detailed'], tps:60,  ttft:0.8 }
  ];
  const HYB = '🪟';

  // Helper: Escape user-entered strings used in innerHTML
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Helper: Effective Prefix text
  function getPrefixText(ch) {
    if (ch.prefixType === 'Custom') {
      return ch.customPrefix || 'Custom prefix';
    }
    return PREFIX_PRESETS[ch.prefixType] || PREFIX_PRESETS['Concise'];
  }

  // --- CUSTOM API MODELS ---
  let customModelSeq = 0;
  function addCustomModel() {
    const nameInput = prompt('Custom LLM name:', '');
    if (nameInput === null) return;
    const name = nameInput.trim();
    if (!name) {
      alert('A name is required.');
      return;
    }

    const endpointInput = prompt(
      'Endpoint URL (OpenAI-compatible /chat/completions):',
      'https://'
    );
    if (endpointInput === null) return;
    const endpoint = endpointInput.trim();
    try {
      const url = new URL(endpoint);
      if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('protocol');
    } catch {
      alert('Enter a valid http(s) endpoint URL.');
      return;
    }

    const apiKeyInput = prompt('API key (leave blank if not required):', '');
    if (apiKeyInput === null) return;

    const id = `custom-${Date.now().toString(36)}-${customModelSeq++}`;
    CH.push({
      id,
      emoji: '🧩',
      name,
      type: 'custom',
      endpoint,
      apiKey: apiKeyInput.trim(),
      checked: true,
      isStatic: false,
      value: 50,
      baseValue: 50,
      locked: false,
      lockedValue: null,
      prefixType: 'Concise',
      customPrefix: '',
      prefix: PREFIX_PRESETS['Concise'],
      tps: 120,
      ttft: 0.5
    });

    renderLeft();
    updateTimer();
  }

  // Helper: Blend cool blue -> warm orange -> glowing gold.
  function heatColor(value) {
    const v = Math.max(1, Math.min(100, Number(value) || 1));
    const lerp = (a, b, t) => Math.round(a + (b - a) * t);
    if (v <= 50) {
      const t = (v - 1) / 49;
      return [lerp(74, 255, t), lerp(158, 154, t), lerp(255, 60, t)];
    }
    const t = (v - 50) / 50;
    return [lerp(255, 255, t), lerp(154, 212, t), lerp(60, 94, t)];
  }

  function applyHeat(row, value) {
    const v = Math.max(1, Math.min(100, Number(value) || 1));
    const [r, g, b] = heatColor(v);
    const t = (v - 1) / 99;
    row.classList.add('heat-row');
    row.style.setProperty('--heat-rgb', `${r}, ${g}, ${b}`);
    row.style.setProperty('--heat-a', (0.04 + 0.20 * t).toFixed(3));
    row.style.setProperty('--heat-border-a', (0.30 + 0.60 * t).toFixed(3));
    row.style.setProperty('--heat-glow', (Math.max(0, (t - 0.7) / 0.3) * 18).toFixed(1));
  }

  // --- STATE FOR LOCKS & MASTER SLIDER ---
  const masterSlider = document.getElementById('masterSlider');
  const masterDelta = document.getElementById('masterDelta');
  const masterLock = document.getElementById('masterLock');

  let masterLocked = false;
  let draggedIdx = null;

  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  function getMasterOffset() {
    return parseInt(masterSlider.value, 10) || 0;
  }

  function syncMasterUI() {
    const offset = getMasterOffset();
    masterDelta.textContent = offset === 0 ? '±0' : (offset > 0 ? `+${offset}` : String(offset));
    masterDelta.classList.toggle('up', offset > 0);
    masterDelta.classList.toggle('down', offset < 0);
  }

  function applyMasterOffset() {
    const offset = getMasterOffset();
    CH.forEach(ch => {
      if (ch.isStatic) return;
      if (masterLocked || !ch.locked) {
        ch.value = clamp(ch.baseValue + offset, 1, 100);
      }
    });
  }

  function commitMasterBaseline() {
    CH.forEach(ch => {
      if (!ch.isStatic) {
        ch.baseValue = ch.value;
        // A committed value is also the new pin for an individually locked model.
        if (ch.locked) ch.lockedValue = ch.value;
      }
    });
    masterSlider.value = '0';
    syncMasterUI();
  }

  function rebaseModel(ch) {
    if (!ch.isStatic) ch.baseValue = clamp(ch.value - getMasterOffset(), 1, 100);
  }

  // --- LEFT BAR RENDERING ---
  function renderLeft() {
    const list = document.getElementById('llmList');
    list.innerHTML = '';

    CH.forEach((ch, index) => {
      const row = document.createElement('div');
      row.dataset.id = ch.id;
      row.dataset.index = index;
      row.setAttribute('draggable', 'true');

      if (ch.isStatic) {
        // Brave / Google: checkbox + drag handle only.
        row.className = `llm-row static-row${ch.checked ? '' : ' off'}`;
        row.innerHTML = `
          <div class="llm-head">
            <span class="grab-handle" title="Drag to reorder">⋮⋮</span>
            <input type="checkbox" ${ch.checked ? 'checked' : ''} aria-label="Enable ${esc(ch.name)}">
            <span class="llm-emoji">${ch.emoji}</span>
            <span class="llm-name">${esc(ch.name)}</span>
          </div>
        `;

        const checkbox = row.querySelector('input[type="checkbox"]');
        checkbox.onclick = (e) => e.stopPropagation();
        checkbox.onchange = () => {
          ch.checked = checkbox.checked;
          row.classList.toggle('off', !ch.checked);
          updateTimer();
        };
      } else {
        // Interactive model row: checkbox + handle + slider + lock + prefix.
        const isSliderDisabled = !masterLocked && ch.locked;
        const currentPrefix = getPrefixText(ch);

        row.className = `llm-row${ch.checked ? '' : ' off'}`;
        applyHeat(row, ch.value);

        row.innerHTML = `
          <div class="llm-head">
            <span class="grab-handle" title="Drag to reorder">⋮⋮</span>
            <input type="checkbox" ${ch.checked ? 'checked' : ''} aria-label="Enable ${esc(ch.name)}">
            <span class="llm-emoji">${ch.emoji}</span>
            <span class="llm-name">${esc(ch.name)}</span>
            ${ch.type === 'custom' ? `<span class="model-badge" title="${esc(ch.endpoint)}">API</span>` : ''}
            <button class="lock-btn${ch.locked ? ' on' : ''}" title="${ch.locked ? 'Unlock model' : 'Lock model'}" aria-label="${ch.locked ? 'Unlock model' : 'Lock model'}" aria-pressed="${ch.locked}">${ch.locked ? '🔒' : '🔓'}</button>
          </div>
          <div class="slider-row">
            <input type="range" min="1" max="100" step="1" value="${ch.value}" ${isSliderDisabled ? 'disabled' : ''} aria-label="${esc(ch.name)} detail level">
          </div>
          <div class="prefix-row">
            <span class="prefix-label">Prefix</span>
            <select class="prefix-select" aria-label="${esc(ch.name)} prefix">
              <option value="Concise" ${ch.prefixType === 'Concise' ? 'selected' : ''}>Concise</option>
              <option value="Detailed" ${ch.prefixType === 'Detailed' ? 'selected' : ''}>Detailed</option>
              <option value="ELI5" ${ch.prefixType === 'ELI5' ? 'selected' : ''}>ELI5</option>
              ${ch.prefixType === 'Custom' ? `<option value="Custom" selected>Custom</option>` : ''}
            </select>
            <button class="prefix-edit-btn" title="Edit custom prefix" aria-label="Edit custom prefix">✏️</button>
          </div>
          <div class="prefix-preview" title="${esc(currentPrefix)}">↳ ${esc(currentPrefix)}</div>
        `;

        // Checkbox state
        const checkbox = row.querySelector('input[type="checkbox"]');
        checkbox.onclick = (e) => e.stopPropagation();
        checkbox.onchange = () => {
          ch.checked = checkbox.checked;
          row.classList.toggle('off', !ch.checked);
          updateTimer();
        };

        // Per-model slider. A manual edit becomes the new baseline.
        const slider = row.querySelector('input[type="range"]');
        slider.oninput = () => {
          ch.value = parseInt(slider.value, 10);
          commitMasterBaseline();
          applyHeat(row, ch.value);
          updateHistory();
          updateTimer();
        };

        // Model lock at the far right of the header row
        const lockBtn = row.querySelector('.lock-btn');
        lockBtn.onclick = (e) => {
          e.stopPropagation();
          if (ch.locked) {
            ch.locked = false;
            ch.lockedValue = null;
          } else {
            ch.locked = true;
            ch.lockedValue = ch.value;
          }
          rebaseModel(ch);
          renderLeft();
          updateTimer();
        };

        // Prefix preset dropdown
        const prefixSelect = row.querySelector('.prefix-select');
        prefixSelect.onchange = (e) => {
          e.stopPropagation();
          ch.prefixType = prefixSelect.value;
          ch.prefix = getPrefixText(ch);
          renderLeft();
        };

        // Pencil -> prompt() -> store the custom string back on CH
        const editBtn = row.querySelector('.prefix-edit-btn');
        editBtn.onclick = (e) => {
          e.stopPropagation();
          const current = ch.customPrefix || getPrefixText(ch);
          const result = prompt(`Enter custom prefix for ${ch.name}:`, current);
          if (result !== null && result.trim() !== '') {
            ch.customPrefix = result.trim();
            ch.prefixType = 'Custom';
            ch.prefix = ch.customPrefix;
            renderLeft();
          }
        };
      }

      // Interactive controls should not trigger row selection or row drag.
      row.querySelectorAll('input, select, button').forEach(el => {
        el.setAttribute('draggable', 'false');
        el.onmousedown = (e) => e.stopPropagation();
      });

      // Clicking the row (outside a control/handle) toggles its checkbox.
      row.onclick = (e) => {
        if (e.target.closest('input, select, button, .grab-handle')) return;
        ch.checked = !ch.checked;
        renderLeft();
        updateTimer();
      };

      // HTML5 drag-and-drop: dropping on a lower row inserts after it,
      // dropping on a higher row inserts before it.
      row.ondragstart = (e) => {
        if (e.target.closest('input, select, button')) {
          e.preventDefault();
          return;
        }
        draggedIdx = index;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(index));
        setTimeout(() => row.classList.add('dragging'), 0);
      };

      row.ondragover = (e) => {
        if (draggedIdx === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        row.classList.add('drag-over');
      };

      row.ondragleave = () => {
        row.classList.remove('drag-over');
      };

      row.ondrop = (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const from = draggedIdx !== null
          ? draggedIdx
          : parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (!Number.isInteger(from) || from === index) {
          draggedIdx = null;
          return;
        }
        const [movedItem] = CH.splice(from, 1);
        CH.splice(index, 0, movedItem);
        draggedIdx = null;
        renderLeft();
      };

      row.ondragend = () => {
        draggedIdx = null;
        document.querySelectorAll('.llm-row').forEach(r => {
          r.classList.remove('dragging', 'drag-over');
        });
      };

      list.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-custom-btn';
    addBtn.textContent = '➕ Add Custom LLM';
    addBtn.title = 'Add an OpenAI-compatible API endpoint';
    addBtn.onclick = addCustomModel;
    list.appendChild(addBtn);
  }

  // --- MASTER LOCK BUTTON ---
  masterLock.onclick = (e) => {
    e.stopPropagation();
    masterLocked = !masterLocked;
    masterLock.classList.toggle('on', masterLocked);
    masterLock.setAttribute('aria-pressed', String(masterLocked));
    masterLock.textContent = masterLocked ? '🔒' : '🔓';
    masterLock.title = masterLocked
      ? 'Master Lock ON: overrides individual locks'
      : 'Master Lock OFF: individual locks respected';
    if (masterLocked) {
      applyMasterOffset();
    } else {
      // Releasing the master lock hands control back to individual locks:
      // restore each locked model to the value it was pinned at.
      CH.forEach(ch => {
        if (!ch.isStatic && ch.locked && ch.lockedValue != null) {
          ch.value = ch.lockedValue;
        }
      });
    }
    renderLeft();
    updateTimer();
  };

  // --- MASTER SLIDER: RELATIVE OFFSET, NOT ABSOLUTE VALUE ---
  // Each model keeps its own baseValue. The master slider is an offset in
  // the range -100..+100:
  //   20/50 +10 -> 30/60, then back to 0 -> 20/50 exactly.
  // Individual values clamp at 1/100, but the master offset can keep going
  // until every model has reached the cap.
  masterSlider.oninput = () => {
    applyMasterOffset();
    syncMasterUI();
    renderLeft();
    updateHistory();
    updateTimer();
  };

  // --- TRIO TOGGLE (Max heat for DeepSeek, Perplexity, Meta) ---
  const trio = document.getElementById('trioToggle');
  let trioOn = false;
  trio.onclick = () => {
    trioOn = !trioOn;
    trio.classList.toggle('on', trioOn);
    ['deepseek', 'perplexity', 'meta'].forEach(id => {
      const c = CH.find(x => x.id === id);
      if (c && !c.isStatic) {
        c.value = trioOn ? 100 : 50;
        c.baseValue = c.value;
      }
    });
    commitMasterBaseline();
    renderLeft();
    updateHistory();
    updateTimer();
  };

  // --- CONVERSATION & TURNS STATE ---
  let turns = [];
  let activeTab = 'hybrid';
  const openState = {};
  const isOpen = (t, id) => !!openState[t.n + ':' + id];
  const setOpen = (t, id, v) => { openState[t.n + ':' + id] = v; };

  function channelsUsed() {
    const used = new Set();
    turns.forEach(t => {
      Object.keys(t.replies || {}).forEach(id => used.add(id));
      if (t.hybrid) {
        (t.hybrid.sources || []).forEach(id => used.add(id));
        Object.keys(t.hybrid.omitted || {}).forEach(id => used.add(id));
      }
    });
    return used;
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    const used = channelsUsed();
    const h = document.createElement('button');
    h.className = 'tab' + (activeTab === 'hybrid' ? ' active' : '');
    h.textContent = HYB;
    h.onclick = () => { activeTab = 'hybrid'; renderAll(); };
    tabs.appendChild(h);

    CH.forEach(ch => {
      if (!used.has(ch.id)) return;
      const b = document.createElement('button');
      b.className = 'tab' + (ch.id === activeTab ? ' active' : '');
      b.textContent = ch.emoji;
      b.title = ch.name;
      b.onclick = () => { activeTab = ch.id; renderAll(); };
      tabs.appendChild(b);
    });
  }

  function scoreClass(pct) { return pct >= 80 ? '' : pct >= 50 ? 'mid' : 'low'; }

  function parseScore(raw) {
    const m = (raw || '').match(/SCORE:\s*(\d+(?:\.\d+)?)\s*\/\s*10/i);
    const r = (raw || '').match(/REASON:\s*(.+?)(?:\n|$)/i);
    return { score: m ? parseFloat(m[1]) : null, reason: r ? r[1].trim() : '' };
  }
  function stripScore(raw) { return (raw || '').replace(/\n*SCORE:[\s\S]*$/i, '').trim(); }

  function renderConv() {
    const wrap = document.getElementById('convWrap');
    wrap.innerHTML = '';
    const depth = parseInt(document.getElementById('hsRange').value);

    turns.forEach((t, idx) => {
      const inCtx = idx < depth;
      const el = document.createElement('div');
      el.className = 'turn' + (inCtx ? ' in-ctx' : '');

      const head = document.createElement('div');
      head.className = 'turn-head';
      head.innerHTML = `<span class="tnum">▶ T${t.n}</span>
        <span>·</span>
        <span>${t.prompt.slice(0, 60)}${t.prompt.length > 60 ? '…' : ''}</span>
        ${inCtx ? '<span style="color:var(--accent);font-size:13px">· in context</span>' : ''}
        <button class="log-btn" title="Channel log">📜</button>`;
      el.appendChild(head);

      const p = document.createElement('div');
      p.className = 'prompt-card';
      p.innerHTML = '<div class="who">You</div>';
      p.appendChild(document.createTextNode(t.prompt));
      el.appendChild(p);

      if (activeTab === 'hybrid' && t.hybrid) {
        const card = document.createElement('div');
        card.className = 'hybrid-card';

        const lbl = document.createElement('div');
        lbl.className = 'hybrid-label';
        lbl.textContent = `${HYB} Hybrid`;
        card.appendChild(lbl);

        const body = document.createElement('div');
        body.className = 'hybrid-body';
        body.textContent = t.hybrid.text;
        card.appendChild(body);

        const sb = document.createElement('div');
        sb.className = 'score-bar ' + scoreClass(t.hybrid.score);
        sb.innerHTML = `<span class="pct">🎯 ${t.hybrid.score}%</span>
          <span class="reason">${t.hybrid.reason || ''}</span>`;
        sb.onclick = (e) => { e.stopPropagation(); sb.classList.toggle('open'); };
        card.appendChild(sb);

        const bar = document.createElement('div');
        bar.className = 'source-bar';

        const emojiButtons = (t.order || []).map(id => {
          const ch = CH.find(x => x.id === id);
          if (!ch) return '';
          const omitted = t.hybrid.omitted && t.hybrid.omitted[id];
          const isSrc = (t.hybrid.sources || []).includes(id);
          const cls = 'src-emoji'
            + (isOpen(t, id) ? ' on' : '')
            + (omitted ? ' omitted' : '')
            + (!isSrc && !omitted ? ' omitted' : '');
          return `<button class="${cls}" data-id="${id}" title="${ch.name}${omitted ? ' — omitted: ' + omitted : ''}">${ch.emoji}</button>`;
        }).join('');

        bar.innerHTML = `${emojiButtons}
          <span class="spacer"></span>
          <button class="bar-act" data-act="sources">⊞ View Sources</button>
          <button class="bar-act" data-act="all">⊞ Expand All</button>`;

        bar.querySelectorAll('.src-emoji').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            setOpen(t, id, !isOpen(t, id));
            renderConv();
          };
        });
        bar.querySelector('[data-act="sources"]').onclick = (e) => {
          e.stopPropagation();
          (t.hybrid.sources || []).forEach(id => setOpen(t, id, true));
          renderConv();
        };
        bar.querySelector('[data-act="all"]').onclick = (e) => {
          e.stopPropagation();
          const anyClosed = (t.order || []).some(id => !isOpen(t, id));
          (t.order || []).forEach(id => setOpen(t, id, anyClosed));
          renderConv();
        };
        card.appendChild(bar);

        (t.order || []).forEach(id => {
          const ch = CH.find(x => x.id === id);
          if (!ch) return;
          const raw = t.replies ? t.replies[id] : null;
          if (!raw) return;
          const parsed = parseScore(raw);
          const pct = parsed.score != null ? Math.round(parsed.score * 10) : null;
          const replyBody = stripScore(raw);

          const sr = document.createElement('div');
          sr.className = 'src-reply' + (isOpen(t, id) ? ' open' : '');
          const head2 = document.createElement('div');
          head2.className = 'src-head';
          head2.innerHTML = `<span>${ch.emoji} ${ch.name}</span>
            <span class="time">${((t.times && t.times[id]) || 0).toFixed(1)}s</span>
            ${pct != null ? `<span class="pct ${scoreClass(pct)}">🎯 ${pct}%</span>` : ''}`;
          sr.appendChild(head2);
          sr.appendChild(document.createTextNode(replyBody));
          if (parsed.reason) {
            const rr = document.createElement('div');
            rr.className = 'src-reason';
            rr.textContent = parsed.reason;
            sr.appendChild(rr);
          }
          card.appendChild(sr);
        });

        el.appendChild(card);
      }

      if (activeTab !== 'hybrid') {
        const raw = t.replies ? t.replies[activeTab] : null;
        if (raw) {
          const parsed = parseScore(raw);
          const pct = parsed.score != null ? Math.round(parsed.score * 10) : null;
          const replyBody = stripScore(raw);
          const ch = CH.find(c => c.id === activeTab) || {};

          const card = document.createElement('div');
          card.className = 'hybrid-card';
          const head3 = document.createElement('div');
          head3.className = 'hybrid-label';
          head3.textContent = `${ch.emoji || ''} ${ch.name || ''}`;
          card.appendChild(head3);

          const bd = document.createElement('div');
          bd.className = 'hybrid-body';
          bd.textContent = replyBody;
          card.appendChild(bd);

          if (pct != null) {
            const sb = document.createElement('div');
            sb.className = 'score-bar ' + scoreClass(pct);
            sb.innerHTML = `<span class="pct">🎯 ${pct}%</span>
              <span class="reason">${parsed.reason}</span>`;
            sb.onclick = (e) => { e.stopPropagation(); sb.classList.toggle('open'); };
            card.appendChild(sb);
          }
          el.appendChild(card);
        }
      }

      wrap.appendChild(el);
    });
  }

  // --- HISTORY CONTEXT CALCULATIONS ---
  const hsRange = document.getElementById('hsRange');
  const hsPreview = document.getElementById('hsPreview');
  const hsDepth = document.getElementById('hsDepth');
  const hsTok = document.getElementById('hsTok');
  const hsMeta = document.getElementById('hsMeta');
  const hsNext = document.getElementById('hsNext');

  const est = s => Math.ceil((s || '').length / 4);
  function turnTok(t) {
    let n = est(t.prompt);
    Object.values(t.replies || {}).forEach(r => n += est(r));
    if (t.hybrid) n += est(t.hybrid.text);
    return n;
  }
  function tokUpTo(d) { return turns.slice(0, d).reduce((s, t) => s + turnTok(t), 0); }

  function updateHistory() {
    const d = parseInt(hsRange.value);
    if (d === 0) {
      hsPreview.innerHTML = `<strong>0:</strong> fresh — no prior context`;
      hsDepth.textContent = '0 turns';
    } else {
      const last = turns[d - 1];
      if (last) {
        hsPreview.innerHTML = `<strong>T${d}:</strong> "${last.prompt.slice(0, 60)}${last.prompt.length > 60 ? '…' : ''}"`;
        hsDepth.textContent = d + ' turn' + (d === 1 ? '' : 's');
      }
    }
    hsTok.textContent = tokUpTo(d) + ' tok';
    hsMeta.textContent = d === 0 ? `0 of ${turns.length} — fresh` : `${d} of ${turns.length} in context`;
    hsNext.textContent = '~' + estimateSend().toFixed(1) + 's';
    renderConv();
  }
  hsRange.oninput = updateHistory;

  // --- STATUSBAR TIMINGS & ANIMATION ---
  const sbTimer = document.getElementById('sbTimer');
  const sbStatus = document.getElementById('sbStatus');
  const sbProgress = document.getElementById('sbProgress');
  const sbFill = document.getElementById('sbFill');

  let inflight = null, ticker = null;
  function estimateSend() {
    const depth = parseInt(hsRange.value);
    const ctxTok = tokUpTo(depth);
    const active = CH.filter(c => c.checked);
    let worst = 0;
    active.forEach(c => {
      const budget = c.isStatic ? 1000 : (c.value * 10);
      worst = Math.max(worst, c.ttft + budget / c.tps + ctxTok / 2000);
    });
    return worst;
  }
  function updateTimer() {
    if (inflight) return;
    sbTimer.textContent = `est. next send: ~${estimateSend().toFixed(1)}s`;
    sbTimer.classList.remove('done');
  }
  function startSend() {
    const active = CH.filter(c => c.checked);
    const estSec = estimateSend();
    inflight = { start: Date.now(), est: estSec, total: active.length, left: active.length };
    sbStatus.textContent = `sending to ${active.length}`;
    sbProgress.style.display = 'block';
    if (ticker) clearInterval(ticker);
    ticker = setInterval(tick, 100);
  }
  function tick() {
    if (!inflight) return;
    const elapsed = (Date.now() - inflight.start) / 1000;
    const left = Math.max(0, inflight.est - elapsed);
    sbFill.style.width = Math.min(100, (elapsed / inflight.est) * 100) + '%';
    sbTimer.textContent = left > 0 ? `${left.toFixed(1)}s left` : 'finishing…';
    sbStatus.textContent = `${inflight.total - inflight.left}/${inflight.total} done · ${elapsed.toFixed(1)}s`;
    if (Math.random() < 0.03 && inflight.left > 0) inflight.left--;
    if (inflight.left === 0) {
      clearInterval(ticker); ticker = null;
      sbTimer.classList.add('done');
      sbTimer.textContent = `✓ done in ${elapsed.toFixed(1)}s`;
      sbStatus.textContent = `${inflight.total} replies`;
      setTimeout(() => {
        inflight = null; sbProgress.style.display = 'none';
        sbFill.style.width = '0%'; sbStatus.textContent = 'idle'; updateTimer();
      }, 2600);
    }
  }

  // --- LEGEND DIALOG ---
  const LEGENDS = {
    idle: [
      ['🔒', 'Master Lock / Model Lock: Master overrides individual locks; a model lock freezes that slider.'],
      ['↕', 'Master Slider: Moves every unlocked model relatively; drag back to ±0 to restore.'],
      ['⋮⋮', 'Drag Handle: Reorder models via HTML5 drag-and-drop.'],
      ['✏️', 'Custom Prefix: Edit personalized instructions stored per model.'],
      ['🔥', 'Visual Heat: Row border/glow shifts from cool blue to orange to glowing gold.'],
      ['🌿', 'Branch: Fork conversation into alternative paths.'],
      ['🪟', 'Hybrid Tab: Consolidated synthesized response.']
    ],
    reply: [
      ['🎯', 'Score Bar: Expand the Fidelity Clause rationale.'],
      ['🦁', 'Source Emoji: Inspect that individual raw model output.'],
      ['⊞ View Sources', 'Opens replies contributing to the synthesis.'],
      ['⊞ Expand All', 'Expands/collapses all outputs for the current turn.']
    ],
    summary: [
      ['🆓', 'Summary Bench: Free API summarization pipelines.'],
      ['⚡', 'Groq API'], ['🧠', 'Cerebras'], ['🟩', 'NVIDIA NIM']
    ]
  };

  function setLegendContext(c) {
    document.getElementById('ctxPill').textContent = c;
    document.querySelectorAll('#ctxSwitch button').forEach(b => {
      b.classList.toggle('active', b.dataset.ctx === c);
    });
    document.getElementById('legendBody').innerHTML = (LEGENDS[c] || [])
      .map(([i, t]) => `<div class="legend-item"><span class="ico">${i}</span><span class="txt">${t}</span></div>`)
      .join('');
  }

  document.querySelectorAll('#ctxSwitch button').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); setLegendContext(b.dataset.ctx); };
  });

  const legendPill = document.getElementById('legendPill');
  const legendDrop = document.getElementById('legendDrop');
  legendPill.onclick = (e) => {
    e.stopPropagation();
    legendDrop.classList.toggle('open');
    legendPill.classList.toggle('open');
  };
  document.addEventListener('click', (e) => {
    if (!legendDrop.contains(e.target) && e.target !== legendPill) {
      legendDrop.classList.remove('open'); legendPill.classList.remove('open');
    }
  });

  function renderAll() {
    if (turns.length > 0) {
      hsRange.max = turns.length;
      if (parseInt(hsRange.value) > turns.length) hsRange.value = turns.length;
    }
    renderTabs();
    renderConv();
  }

  // --- INITIALIZE UI ---
  syncMasterUI();
  renderLeft();
  renderAll();
  updateHistory();
  updateTimer();
  setLegendContext('idle');


  // ==========================================
  // --- ELECTRON APP INTEGRATION ---
  // ==========================================

  // 1. Clear Chat
  window.clearChat = () => {
    turns = [];
    renderAll();
    const wrap = document.getElementById('convWrap');
    if (wrap) wrap.innerHTML = '';
    updateHistory();
  };

  // 2. Settings: store the DeepSeek key via encrypted IPC
  const settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) {
    settingsBtn.onclick = async () => {
      if (!window.api?.getDeepSeekKeyStatus || !window.api?.setDeepSeekKey) {
        alert('Settings are available in the Electron desktop app.');
        return;
      }

      let status = { configured: false };
      try {
        status = await window.api.getDeepSeekKeyStatus();
      } catch {
        // Fall through to the prompt; saving will surface any real error.
      }

      const message = status.source === 'environment'
        ? 'DEEPSEEK_API_KEY is active and takes precedence. Enter a key to store for future sessions (blank to keep current):'
        : status.configured
          ? 'DeepSeek API key is configured. Enter a new key (leave blank to keep it):'
          : 'Enter your DeepSeek API key:';
      const key = prompt(message, '');
      if (key === null || !key.trim()) return;

      try {
        const result = await window.api.setDeepSeekKey(key.trim());
        if (result?.ok) {
          alert('DeepSeek API key saved securely.');
        } else {
          alert(result?.error || 'Could not save the DeepSeek API key.');
        }
      } catch (error) {
        alert(`Could not save the DeepSeek API key: ${error.message}`);
      }
    };
  }

  // 3. Send Button Action
  document.getElementById('sendBtn').onclick = () => {
    const promptText = document.getElementById('masterText').value.trim();
    if (!promptText) return;

    const active = CH.filter(c => c.checked);
    const activeModels = active.map(c => c.id);
    if (activeModels.length === 0) return alert("Select at least one model.");

    const engine = document.getElementById('engineToggle').value;
    const customModels = active
      .filter(c => c.type === 'custom')
      .map(c => ({
        id: c.id,
        name: c.name,
        endpoint: c.endpoint,
        apiKey: c.apiKey
      }));

    const newTurn = {
      n: turns.length + 1,
      prompt: promptText,
      engine,
      replies: {},
      order: activeModels,
      times: {},
      hybrid: { text: "Waiting for LLMs...", sources: activeModels, score: 0, reason: "" }
    };

    turns.push(newTurn);
    document.getElementById('masterText').value = '';
    renderAll();
    updateTimer();
    startSend();

    if (window.api?.sendPrompt) {
      window.api.sendPrompt(promptText, activeModels, engine, customModels);
    }
  };

  // 4. LLM Individual Replies via IPC
  if (window.api?.onReplyReceived) {
    window.api.onReplyReceived((data) => {
      const currentTurn = turns[turns.length - 1];
      if (currentTurn) {
        if (data.text) currentTurn.replies[data.model] = data.text;
        if (!currentTurn.order.includes(data.model)) {
          currentTurn.order.push(data.model);
        }
        currentTurn.hybrid.text = "Synthesizing...";
        currentTurn.hybrid.reason = String(currentTurn.engine || '').includes('Cloud')
          ? "Running DeepSeek cloud synthesis..."
          : "Running local OpenVINO model...";
        renderAll();
      }
    });
  }

  // 5. Hybrid Stream via IPC
  if (window.api?.onHybridStream) {
    window.api.onHybridStream((chunk) => {
      const currentTurn = turns[turns.length - 1];
      if (currentTurn && currentTurn.hybrid) {
        const placeholder = currentTurn.hybrid.text;
        if (placeholder === "Synthesizing..." || placeholder === "Waiting for LLMs...") {
          currentTurn.hybrid.text = "";
        }
        currentTurn.hybrid.text += chunk;

        const allTurns = document.querySelectorAll('.turn');
        if (allTurns.length > 0) {
          const lastTurn = allTurns[allTurns.length - 1];
          const hybridBody = lastTurn.querySelector('.hybrid-body');
          if (hybridBody) {
            hybridBody.textContent = currentTurn.hybrid.text;
            const centerPanel = document.querySelector('.center');
            if (centerPanel) centerPanel.scrollTop = centerPanel.scrollHeight;
          }
        }
      }
    });
  }

  // 6. Hybrid Synthesis Complete via IPC
  if (window.api?.onHybridComplete) {
    window.api.onHybridComplete(() => {
      const currentTurn = turns[turns.length - 1];
      if (currentTurn) {
        currentTurn.hybrid.score = 100;
        currentTurn.hybrid.reason = "Synthesis Complete";

        const scoreBars = document.querySelectorAll('.score-bar');
        if (scoreBars.length > 0) {
          const lastScoreBar = scoreBars[scoreBars.length - 1];
          lastScoreBar.className = 'score-bar';
          lastScoreBar.innerHTML = `<span class="pct">🎯 100%</span><span class="reason">Synthesis Complete</span>`;
        }
      }
    });
  }
</script>
</body>
</html>
