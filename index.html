<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LLM Explorer</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1d2129; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#8a92a6; --accent:#6ea8fe; --accent-2:#4f7dd6;
    --amber:#f0b429; --green:#3fb950; --red:#f85149; --purple:#a371f7;
    --radius:8px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:18px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .app { display:grid; height:100vh;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "left center" "bottom bottom"; }

  /* ---- Top ---- */
  .topbar { grid-area: top; display:flex; align-items:flex-end; gap:8px;
    padding:6px 10px 0; border-bottom:1px solid var(--border); background:var(--panel);
    position:relative; }

  .tabs { display:flex; gap:3px; flex:1; overflow-x:auto; }
  .tab { padding:8px 14px; border:1px solid transparent; border-bottom:none;
    border-radius:6px 6px 0 0; background:transparent; color:var(--muted);
    cursor:pointer; font-size:18px; white-space:nowrap; font-family:inherit; }
  .tab.active { background:var(--bg); color:var(--text); border-color:var(--border); }
  .branch-pill, .legend-pill { font-size:16px; color:var(--muted); padding:6px 11px;
    border:1px solid var(--border); border-radius:6px; cursor:pointer;
    white-space:nowrap; margin-bottom:4px; background:transparent; font:inherit; }
  .branch-pill:hover, .legend-pill:hover { border-color:var(--accent); color:var(--text); }
  .legend-pill.open { border-color:var(--accent); color:var(--text); }

  .legend-drop { position:absolute; top:calc(100% + 4px); right:60px;
    background:var(--panel-2); border:1px solid var(--accent);
    border-radius:10px; padding:14px; width:380px;
    box-shadow:0 12px 40px rgba(0,0,0,.7); z-index:50;
    display:none; font-size:16px; }
  .legend-drop.open { display:block; }
  .legend-drop .ld-head { display:flex; align-items:center; gap:6px;
    font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:8px; }
  .legend-drop .ld-head .spacer { flex:1; }
  .legend-drop .ctx-switch { display:flex; gap:3px; margin-bottom:10px; }
  .legend-drop .ctx-switch button { flex:1; padding:6px 8px; font-size:14px;
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    color:var(--muted); cursor:pointer; }
  .legend-drop .ctx-switch button.active { color:var(--text); border-color:var(--accent); }
  .legend-drop .legend-list { display:flex; flex-direction:column; gap:8px;
    max-height:400px; overflow-y:auto; }
  .legend-drop .legend-item { display:flex; gap:10px; align-items:flex-start; }
  .legend-drop .legend-item .ico { min-width:28px; font-size:20px; text-align:center; }
  .legend-drop .legend-item .txt { color:var(--muted); line-height:1.4; }

  /* ---- Left ---- */
  .leftbar { grid-area: left; border-right:1px solid var(--border);
    background:var(--panel); padding:12px; overflow-y:auto;
    display:flex; flex-direction:column; gap:12px; }
  .lb-section { font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:2px 0; font-weight:600; }
  .master-slider { background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; }
  .master-slider .head { display:flex; align-items:center; gap:8px;
    margin-bottom:8px; }
  .master-slider .label { font-size:15px; color:var(--muted); font-weight:500; }
  .master-slider .head .spacer { flex:1; }
  .master-delta { font-size:13px; font-weight:600; color:var(--muted);
    font-variant-numeric:tabular-nums; min-width:34px; }
  .master-delta.up { color:var(--amber); }
  .master-delta.down { color:var(--accent); }

  .slider-row { display:flex; align-items:center; gap:8px; width:100%; }
  .slider-row input[type="range"] { flex:1; accent-color:var(--amber);
    height:6px; cursor:pointer; margin:0; }
  .slider-row input[type="range"]:disabled { opacity:.45; cursor:not-allowed; }

  .lock-btn { background:transparent; border:1px solid transparent;
    color:var(--muted); cursor:pointer; padding:2px 6px;
    border-radius:4px; font-size:17px; opacity:.4; line-height:1;
    transition:all .15s ease; }
  .lock-btn:hover { background:rgba(255,255,255,.08); opacity:.85; }
  .lock-btn.on { opacity:1; border-color:var(--accent);
    filter:drop-shadow(0 0 4px var(--accent)); color:#fff; }

  .remove-btn { background:transparent; border:1px solid transparent;
    color:var(--muted); cursor:pointer; padding:2px 6px;
    border-radius:4px; font-size:13px; opacity:.4; line-height:1;
    transition:all .15s ease; }
  .remove-btn:hover { background:rgba(255,107,107,.12); opacity:1; color:#ff6b6b; }

  .trio-toggle { display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); cursor:pointer; font-size:15px; user-select:none; }
  .trio-toggle:hover { border-color:var(--green); }
  .trio-toggle.on { border-color:var(--green); color:var(--green); }
  .trio-toggle .sw { width:36px; height:20px; border-radius:12px;
    background:var(--border); position:relative; transition:background .15s; flex-shrink:0; }
  .trio-toggle.on .sw { background:var(--green); }
  .trio-toggle .sw::after { content:''; position:absolute; top:2px; left:2px;
    width:16px; height:16px; border-radius:50%; background:#fff;
    transition:transform .15s; }
  .trio-toggle.on .sw::after { transform:translateX(16px); }

  .llm-list-container { display:flex; flex-direction:column; gap:10px; }

  .llm-row { padding:10px 12px; border:1px solid var(--border); background:var(--panel-2);
    border-radius:8px; display:flex; flex-direction:column; gap:8px;
    cursor:pointer; transition:border-color .15s, background .15s, box-shadow .15s;
    user-select:none; position:relative; }
  .llm-row:hover { border-color:var(--accent); }
  .llm-row.off { opacity:.45; }
  .llm-row.static-row { gap:0; }

  /* Visual heat: cool blue -> warm orange -> glowing gold.
     --heat-rgb / --heat-a / --heat-border-a / --heat-glow are set per row
     from the model's current slider value in applyHeat(). */
  .llm-row.heat-row {
    border-color: rgba(var(--heat-rgb, 74, 158, 255), var(--heat-border-a, .3));
    background: linear-gradient(100deg,
      rgba(var(--heat-rgb, 74, 158, 255), var(--heat-a, .04)) 0%,
      var(--panel-2) 78%);
    box-shadow:
      0 0 calc(var(--heat-glow, 0) * 1px) rgba(var(--heat-rgb, 74, 158, 255), .45),
      inset 0 0 calc(var(--heat-glow, 0) * .6px) rgba(var(--heat-rgb, 74, 158, 255), .18);
  }
  .llm-row.heat-row:hover {
    border-color: rgba(var(--heat-rgb, 74, 158, 255), 1);
  }

  /* Drag feedback is declared after the heat rules so it wins the cascade:
     .llm-row.heat-row would otherwise override the drag border/glow. */
  .llm-row.dragging { opacity:.35; border:1px dashed var(--accent); }
  .llm-row.drag-over { border-color:var(--accent);
    box-shadow:0 -2px 0 0 var(--accent), 0 0 0 1px var(--accent) inset; }

  .llm-head { display:flex; align-items:center; gap:8px; font-size:17px; }
  .grab-handle { cursor:grab; color:var(--muted); font-size:16px; user-select:none;
    padding:0 4px 0 0; display:inline-flex; align-items:center; line-height:1; opacity:.6; }
  .grab-handle:hover { opacity:1; color:var(--text); }
  .grab-handle:active { cursor:grabbing; }

  .llm-head input[type="checkbox"] { accent-color:var(--accent);
    margin:0; width:22px; height:22px; cursor:pointer; flex-shrink:0; }
  .llm-emoji { font-size:19px; }
  .llm-name { flex:1; font-weight:600; font-size:16px; }

  /* Prefixes Row */
  .prefix-row { display:flex; align-items:center; gap:6px; padding-top:4px;
    border-top:1px dashed var(--border); }
  .prefix-label { font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; font-weight:500; }
  .prefix-select { flex:1; background:var(--bg); border:1px solid var(--border);
    border-radius:4px; color:var(--text); font-size:13px; padding:3px 6px;
    outline:none; cursor:pointer; font-family:inherit; }
  .prefix-select:focus { border-color:var(--accent); }
  .prefix-edit-btn { background:transparent; border:1px solid var(--border);
    border-radius:4px; color:var(--text); cursor:pointer; padding:2px 6px;
    font-size:13px; line-height:1.2; font-family:inherit; }
  .prefix-edit-btn:hover { border-color:var(--accent); background:rgba(255,255,255,.06); }
  .prefix-preview { font-size:12px; color:var(--muted); font-style:italic;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px; }

  /* ---- Center ---- */
  .center { grid-area: center; overflow-y:auto; padding:20px 28px; }
  .wrap { max-width:950px; margin:0 auto; }
  .turn { margin-bottom:24px; border-left:2px solid transparent; padding-left:14px; }
  .turn.in-ctx { border-left-color:var(--accent); }

  .turn-head { display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:12px; font-size:15px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    user-select:none; padding:6px 0; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border); }
  .turn-head:hover { color:var(--text); }
  .turn-head .tnum { color:var(--accent); font-weight:600; }
  .turn-head .log-btn { background:transparent; border:none; color:var(--muted);
    cursor:pointer; padding:2px 6px; border-radius:4px; font-size:16px; }

  .prompt-card { padding:12px 14px; border-radius:var(--radius);
    background:#141821; border:1px solid var(--border); font-size:18px;
    margin-bottom:12px; white-space:pre-wrap; word-wrap:break-word; }
  .prompt-card .who { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px; }

  .hybrid-card { border-radius:var(--radius); background:#161e2e;
    border:1px solid #2a3d5c; overflow:hidden; margin-bottom:8px; }
  .hybrid-label { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent); padding:8px 14px 0 14px; }
  .hybrid-body { padding:6px 14px 12px 14px; font-size:18px;
    white-space:pre-wrap; word-wrap:break-word; }

  .score-bar { padding:10px 14px; font-size:16px; cursor:pointer;
    background:rgba(63,185,80,.09); color:var(--green);
    border-top:1px solid var(--border);
    display:flex; gap:8px; align-items:flex-start; }
  .score-bar.mid { background:rgba(240,180,41,.09); color:var(--amber); }
  .score-bar.low { background:rgba(248,81,73,.09); color:var(--red); }
  .score-bar .pct { font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums; min-width:60px; }
  .score-bar .reason { flex:1; color:var(--muted); font-weight:400;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score-bar.open .reason { white-space:normal; }

  .source-bar { display:flex; align-items:center; gap:8px; padding:8px 12px;
    border-top:1px solid var(--border); background:rgba(0,0,0,.15);
    cursor:pointer; user-select:none; flex-wrap:wrap; }
  .source-bar:hover { background:rgba(255,255,255,.03); }
  .src-emoji { background:var(--panel); border:1px solid var(--border);
    color:var(--text); cursor:pointer; padding:5px 10px; font-size:17px;
    border-radius:6px; font-family:inherit; }
  .src-emoji:hover { border-color:var(--accent); }
  .src-emoji.on { border-color:var(--accent); background:#1a2130;
    box-shadow:0 0 0 1px var(--accent) inset; }
  .src-emoji.omitted { opacity:.45; }
  .source-bar .spacer { flex:1; }
  .source-bar .bar-act { background:transparent; border:1px solid var(--border);
    color:var(--muted); cursor:pointer; padding:5px 10px; font-size:15px;
    border-radius:5px; font-family:inherit; }
  .source-bar .bar-act:hover { color:var(--text); border-color:var(--accent); }

  .src-reply { display:none; border-top:1px solid var(--border);
    background:var(--panel); padding:12px 14px; font-size:18px;
    white-space:pre-wrap; word-wrap:break-word; }
  .src-reply.open { display:block; }
  .src-reply .src-head { font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
    display:flex; gap:8px; align-items:center; }
  .src-reply .src-head .time { color:var(--muted); font-size:14px;
    text-transform:none; letter-spacing:0; }
  .src-reply .src-head .pct { margin-left:auto; color:var(--green);
    font-weight:600; font-variant-numeric:tabular-nums; }
  .src-reply .src-head .pct.mid { color:var(--amber); }
  .src-reply .src-head .pct.low { color:var(--red); }
  .src-reply .src-reason { font-size:14px; color:var(--muted);
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }

  /* ---- Bottom ---- */
  .bottom { grid-area: bottom; border-top:1px solid var(--border);
    background:var(--panel); padding:12px 16px;
    display:flex; flex-direction:column; gap:8px; }
  .bottom-inner { max-width:950px; margin:0 auto; width:100%;
    display:flex; flex-direction:column; gap:8px; }

  .history { background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px;
    display:flex; flex-direction:column; gap:8px; }
  .hs-head { display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--muted); letter-spacing:.08em;
    text-transform:uppercase; }
  .hs-head .spacer { flex:1; }
  .hs-head .meta { font-variant-numeric:tabular-nums; color:var(--accent);
    letter-spacing:0; text-transform:none; font-size:15px; }
  .hs-row { display:flex; align-items:center; gap:10px; }
  .hs-preview { flex:1; min-width:0; font-size:16px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hs-preview strong { color:var(--text); font-weight:600; }
  .hs-track { flex:0 0 260px; }
  .hs-track input[type="range"] { width:100%; accent-color:var(--amber);
    height:6px; cursor:pointer; }
  .hs-stats { display:flex; gap:16px; font-size:15px; color:var(--muted);
    font-variant-numeric:tabular-nums; }
  .hs-stats strong { color:var(--text); font-weight:600; }

  #masterText { width:100%; min-height:60px; max-height:160px; resize:vertical;
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; font:inherit;
    font-size:18px; outline:none; }
  #masterText:focus { border-color:var(--accent); }

  .toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:6px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 12px; font-size:18px; line-height:1; display:flex; align-items:center; gap:6px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent-2); border-color:var(--accent-2); color:#fff; }
  button.toggle { opacity:.45; }
  button.toggle.on { opacity:1; border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset; }
  button.free.on { border-color:var(--green); color:var(--green);
    box-shadow:0 0 0 1px var(--green) inset; }
  .btn-label { font-size:14px; font-weight:500; }

  .engine-picker { display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; }
  .engine-picker:focus-within { border-color:var(--accent); }
  .engine-picker .engine-label { color:var(--muted); font-size:13px;
    text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
  .engine-picker select { background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:4px; padding:4px 6px;
    font:inherit; font-size:14px; cursor:pointer; outline:none; }
  .engine-picker select:focus { border-color:var(--accent); }

  .add-custom-btn { width:100%; justify-content:center;
    border-style:dashed; color:var(--accent); background:transparent;
    font-size:15px; padding:9px 10px; }
  .add-custom-btn:hover { background:rgba(110,168,254,.08); }
  .model-badge { font-size:10px; font-weight:700; letter-spacing:.06em;
    color:var(--purple); border:1px solid var(--purple); border-radius:4px;
    padding:1px 4px; line-height:1.2; text-transform:uppercase; }

  /* ---- Shared modal (window.prompt replacement) ---- */
  .app-modal { position:fixed; inset:0; z-index:1000; display:flex;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.65); }
  .app-modal[hidden] { display:none; }
  .app-modal-panel { width:min(520px, 100%); background:var(--panel-2);
    border:1px solid var(--accent); border-radius:12px; padding:22px;
    box-shadow:0 18px 60px rgba(0,0,0,.75); }
  .app-modal-panel h2 { margin:0 0 8px; color:var(--accent); font-size:22px; }
  .app-modal-message { color:var(--muted); font-size:15px; line-height:1.5;
    margin-bottom:16px; }
  .app-modal-tabs { display:flex; gap:6px; margin-bottom:14px;
    border-bottom:1px solid var(--border); }
  .app-modal-tabs[hidden] { display:none; }
  .app-modal-tab { background:transparent; border:1px solid transparent;
    border-bottom:none; border-radius:6px 6px 0 0; color:var(--muted);
    padding:7px 12px; font-size:14px; line-height:1.2; margin-bottom:-1px; }
  .app-modal-tab:hover { color:var(--text); border-color:var(--border); }
  .app-modal-tab.active { color:var(--accent); background:var(--bg);
    border-color:var(--border); border-bottom-color:var(--bg); }
  .app-modal-fields { display:flex; flex-direction:column; gap:12px; }
  .app-modal-field { display:flex; flex-direction:column; gap:5px; }
  .app-modal-field label { color:var(--muted); font-size:13px;
    letter-spacing:.05em; text-transform:uppercase; }
  .app-modal-field input { width:100%; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:9px 10px;
    font:inherit; font-size:16px; outline:none; }
  .app-modal-field input:focus { border-color:var(--accent); }
  .app-modal-error { color:var(--red); font-size:14px; margin-top:12px; }
  .app-modal-error[hidden] { display:none; }
  .app-modal-actions { display:flex; justify-content:flex-end; gap:8px;
    margin-top:18px; }
  .app-modal-actions .modal-btn { padding:8px 16px; font-size:15px; }

  .statusbar { display:flex; gap:12px; padding:8px 10px; font-size:15px;
    background:#0b0d11; border:1px solid var(--border); border-radius:6px;
    font-variant-numeric:tabular-nums; min-height:32px; align-items:center; }
  .sb-prompt { color:var(--accent); font-weight:600; white-space:nowrap; }
  .sb-timer { color:var(--amber); white-space:nowrap; font-weight:600; }
  .sb-timer.done { color:var(--green); }
  .sb-status { color:var(--muted); white-space:nowrap; }
  .sb-progress { flex:1; height:4px; background:var(--border); border-radius:2px;
    overflow:hidden; min-width:60px; position:relative; }
  .sb-progress .fill { position:absolute; inset:0 auto 0 0;
    background:linear-gradient(90deg, var(--amber), var(--accent));
    transition:width .5s linear; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2a2f3a; border-radius:10px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="tabs" id="tabs"></div>
    <button id="loginBtn" onclick="window.api?.startLoginMode?.()" style="padding: 8px 12px; background: #2196F3; color: white; border: none; border-radius: 6px; margin-right: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">🔐 Login Mode</button>
    <button id="newChatBtn" onclick="clearChat()" style="padding: 8px 12px; background: #f44336; color: white; border: none; border-radius: 6px; margin-right: 12px; font-weight: bold; font-size: 15px; cursor: pointer;">🗑️ New Chat</button>
    <button class="legend-pill" id="legendPill">📖 Legend ▾</button>
    <button class="branch-pill">🌿 Branch ▾</button>
    
    <div class="legend-drop" id="legendDrop">
      <div class="ld-head"><span>📖 Legend</span><span class="spacer"></span>
        <span id="ctxPill" style="color:var(--muted);text-transform:none;letter-spacing:0;font-size:15px">idle</span>
      </div>
      <div class="ctx-switch" id="ctxSwitch">
        <button data-ctx="idle" class="active">UI Overview</button>
        <button data-ctx="reply">Reply Tools</button>
        <button data-ctx="summary">Free Bench</button>
      </div>
      <div class="legend-list" id="legendBody"></div>
    </div>
  </div>

  <div class="leftbar">
    <div class="lb-section">Detail & Heat</div>
    <div class="master-slider">
      <div class="head">
        <span class="label">Master Slider</span>
        <span class="master-delta" id="masterDelta">±0</span>
        <span class="spacer"></span>
        <button class="lock-btn" id="masterLock" title="Master Lock OFF: individual locks respected"
          aria-label="Master lock" aria-pressed="false">🔓</button>
      </div>
      <div class="slider-row">
        <input type="range" id="masterSlider" min="-100" max="100" step="1" value="0"
          aria-label="Master relative adjustment">
      </div>
    </div>
