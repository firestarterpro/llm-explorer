<script>
  // --- PREFIX PRESETS ---
  const PREFIX_PRESETS = {
    'Concise': 'Be concise, direct, and avoid preamble.',
    'Detailed': 'Provide a detailed, comprehensive response with examples.',
    'ELI5': "Explain like I'm 5 years old. Use simple language and relatable analogies."
  };

  // --- MODEL CHANNELS (from the main-process provider registry) ---
  // The list comes from window.api.getProviders() at startup, merged with the
  // user's UI preferences. API keys never enter this state.
  let CH = [];
  const UI_PREFS_KEY = 'llmx.uiPrefs.v1';

  function loadUiPrefs() {
    try {
      const parsed = JSON.parse(localStorage.getItem(UI_PREFS_KEY) || '{}');
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveUiPrefs() {
    try {
      const channels = {};
      CH.forEach(ch => {
        channels[ch.id] = {
          checked: !!ch.checked,
          value: ch.value,
          baseValue: ch.baseValue,
          locked: !!ch.locked,
          lockedValue: ch.lockedValue ?? null,
          prefixType: ch.prefixType || 'Concise',
          customPrefix: ch.customPrefix || '',
          maxTokens: ch.maxTokens,
          fidelity: !!ch.fidelity
        };
      });
      localStorage.setItem(UI_PREFS_KEY, JSON.stringify({
        version: 1,
        order: CH.map(ch => ch.id),
        channels
      }));
    } catch {
      // Preference persistence is best-effort; never block the UI on storage.
    }
  }

  function forgetChannelPrefs(id) {
    const prefs = loadUiPrefs();
    if (prefs.channels) delete prefs.channels[id];
    if (Array.isArray(prefs.order)) prefs.order = prefs.order.filter(item => item !== id);
    try {
      localStorage.setItem(UI_PREFS_KEY, JSON.stringify(prefs));
    } catch {
      // Ignore storage failures.
    }
  }

  function buildChannels(providers, prefs) {
    const prefsData = prefs && typeof prefs === 'object' ? prefs : {};
    const savedChannels = prefsData.channels && typeof prefsData.channels === 'object'
      ? prefsData.channels
      : {};
    const byId = new Map(providers.map(provider => [provider.id, provider]));

    // Saved drag order first, then providers added since the last launch.
    const order = [];
    (Array.isArray(prefsData.order) ? prefsData.order : []).forEach(id => {
      if (byId.has(id) && !order.includes(id)) order.push(id);
    });
    providers.forEach(provider => {
      if (!order.includes(provider.id)) order.push(provider.id);
    });

    return order.map(id => {
      const provider = byId.get(id);
      const saved = savedChannels[id] || {};
      const isApi = provider.kind === 'api';
      const prefixType = saved.prefixType || provider.prefixType || 'Concise';
      const value = clamp(Number(saved.value ?? provider.value ?? 50), 1, 100);

      const channel = {
        id,
        name: provider.name || id,
        emoji: provider.emoji || (isApi ? '🧩' : '🌐'),
        kind: provider.kind || 'scrape',
        isStatic: !!provider.isStatic,
        isUser: !!provider.isUser,
        endpoint: provider.endpoint || '',
        modelId: provider.modelId || '',
        keyRef: provider.keyRef || '',
        checked: saved.checked ?? provider.checked ?? false,
        value,
        baseValue: clamp(Number(saved.baseValue ?? value), 1, 100),
        locked: saved.locked ?? false,
        lockedValue: saved.lockedValue ?? null,
        prefixType,
        customPrefix: saved.customPrefix ?? '',
        maxTokens: saved.maxTokens ?? provider.maxTokens ?? 1000,
        fidelity: saved.fidelity ?? !!provider.fidelity,
        tps: Number(provider.tps) || 80,
        ttft: Number(provider.ttft) || 0.5
      };
      channel.prefix = getPrefixText(channel);
      return channel;
    });
  }

  async function refreshProviders() {
    let providers = [];
    if (window.api?.getProviders) {
      try {
        const list = await window.api.getProviders();
        if (Array.isArray(list)) providers = list;
      } catch (error) {
        console.error('Could not load provider registry:', error);
      }
    }
    CH = buildChannels(providers, loadUiPrefs());
    renderLeft();
    updateHistory();
    updateTimer();
  }

  const HYB = '🪟';

  // Helper: Escape user-entered strings used in innerHTML
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Helper: Effective Prefix text
  function getPrefixText(ch) {
    if (ch.prefixType === 'Custom') {
      return ch.customPrefix || 'Custom prefix';
    }
    return PREFIX_PRESETS[ch.prefixType] || PREFIX_PRESETS['Concise'];
  }

  // --- SHARED INPUT MODAL ---
  // Electron's renderer does not implement window.prompt(), so every text
  // prompt goes through this one in-page form.
  // With `tabs`, each tab has its own fields and validation, and the promise
  // resolves to { tab, values } so the caller knows which form was submitted.
  function showAppModal({ title, message = '', fields = [], tabs = null, confirmLabel = 'Save', validate }) {
    const overlay = document.getElementById('appModal');
    const titleEl = document.getElementById('appModalTitle');
    const messageEl = document.getElementById('appModalMessage');
    const tabsEl = document.getElementById('appModalTabs');
    const fieldsEl = document.getElementById('appModalFields');
    const errorEl = document.getElementById('appModalError');
    const cancelBtn = document.getElementById('appModalCancel');
    const saveBtn = document.getElementById('appModalSave');
    const previousFocus = document.activeElement;
    const tabList = Array.isArray(tabs) && tabs.length > 0 ? tabs : null;

    return new Promise(resolve => {
      let inputs = {};
      let activeTab = tabList ? tabList[0].id : null;
      const drafts = {};

      titleEl.textContent = title;
      messageEl.textContent = message;
      messageEl.hidden = !message;
      tabsEl.innerHTML = '';
      tabsEl.hidden = !tabList;
      fieldsEl.innerHTML = '';
      errorEl.textContent = '';
      errorEl.hidden = true;
      saveBtn.textContent = confirmLabel;

      const currentTab = () => (tabList ? tabList.find(tab => tab.id === activeTab) : null);
      const currentFields = () => (currentTab() ? currentTab().fields : fields);

      const readInputs = () => {
        const values = {};
        for (const [name, input] of Object.entries(inputs)) values[name] = input.value;
        return values;
      };

      const renderTabs = () => {
        if (!tabList) return;
        tabsEl.innerHTML = '';
        tabList.forEach(tab => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'app-modal-tab' + (tab.id === activeTab ? ' active' : '');
          button.textContent = tab.label;
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', String(tab.id === activeTab));
          button.onclick = () => switchTab(tab.id);
          tabsEl.appendChild(button);
        });
      };

      const renderFields = () => {
        fieldsEl.innerHTML = '';
        inputs = {};
        const draft = drafts[activeTab || ''] || {};

        currentFields().forEach((field, index) => {
          const wrap = document.createElement('div');
          wrap.className = 'app-modal-field';

          const label = document.createElement('label');
          label.textContent = field.label;
          label.htmlFor = `appModalField${index}`;

          const input = document.createElement('input');
          input.id = label.htmlFor;
          input.name = field.name;
          input.type = field.type || 'text';
          input.value = draft[field.name] ?? field.value ?? '';
          input.placeholder = field.placeholder || '';
          input.autocomplete = field.autocomplete || 'off';
          input.dataset.required = field.required ? '1' : '';
          input.dataset.label = field.label;

          wrap.append(label, input);
          fieldsEl.appendChild(wrap);
          inputs[field.name] = input;
        });
      };

      const focusFirstInput = () => {
        const firstInput = fieldsEl.querySelector('input');
        if (firstInput) {
          firstInput.focus();
          firstInput.select();
        } else {
          saveBtn.focus();
        }
      };

      const switchTab = tabId => {
        if (tabId === activeTab) return;
        drafts[activeTab] = readInputs();
        activeTab = tabId;
        errorEl.textContent = '';
        errorEl.hidden = true;
        renderTabs();
        renderFields();
        focusFirstInput();
      };

      const removeListeners = () => {
        document.removeEventListener('keydown', onKeyDown);
        overlay.onclick = null;
        cancelBtn.onclick = null;
        saveBtn.onclick = null;
      };

      const close = result => {
        removeListeners();
        overlay.hidden = true;
        if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
        resolve(result);
      };

      const showError = text => {
        errorEl.textContent = text;
        errorEl.hidden = false;
      };

      const submit = () => {
        const values = readInputs();

        for (const field of currentFields()) {
          const input = inputs[field.name];
          if (field.required && input && !input.value.trim()) {
            showError(`${field.label || field.name} is required.`);
            input.focus();
            return;
          }
        }

        const validationError = validate ? validate(values, activeTab) : '';
        if (validationError) {
          showError(validationError);
          return;
        }

        const tabDef = currentTab();
        if (tabDef && typeof tabDef.validate === 'function') {
          const tabError = tabDef.validate(values);
          if (tabError) {
            showError(tabError);
            return;
          }
        }

        close(tabList ? { tab: activeTab, values } : values);
      };

      const onKeyDown = event => {
        if (event.key === 'Escape') {
          event.preventDefault();
          close(null);
        } else if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
          event.preventDefault();
          submit();
        }
      };

      overlay.onclick = event => {
        if (event.target === overlay) close(null);
      };
      cancelBtn.onclick = () => close(null);
      saveBtn.onclick = submit;
      document.addEventListener('keydown', onKeyDown);

      renderTabs();
      renderFields();
      overlay.hidden = false;
      focusFirstInput();
    });
  }

  // --- ADD PROVIDER (website scraper or API model) ---
  async function addCustomProvider() {
    const result = await showAppModal({
      title: 'Add Provider',
      message: 'Website scrapers drive a logged-in browser tab; API models call an OpenAI-compatible endpoint.',
      confirmLabel: 'Add',
      tabs: [
        {
          id: 'api',
          label: 'API / Local',
          fields: [
            { name: 'name', label: 'Display name', placeholder: 'My Local Llama', required: true },
            { name: 'modelId', label: 'Model ID', placeholder: 'llama3.1:8b', required: true },
            { name: 'endpoint', label: 'Endpoint URL', value: 'https://', required: true },
            { name: 'apiKey', label: 'API key (optional)', type: 'password', placeholder: 'Leave blank if not required' }
          ],
          validate: form => {
            try {
              const url = new URL(form.endpoint.trim());
              if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('protocol');
            } catch {
              return 'Enter a valid http(s) endpoint URL.';
            }
            return '';
          }
        },
        {
          id: 'scrape',
          label: 'Website / Scraper',
          fields: [
            { name: 'name', label: 'Display name', placeholder: 'My Website', required: true },
            { name: 'url', label: 'URL', value: 'https://', required: true },
            { name: 'inputSelector', label: 'Input Selector', placeholder: '#prompt-textarea, textarea', required: true },
            { name: 'responseSelector', label: 'Response Selector', placeholder: '.markdown', required: true }
          ],
          validate: form => {
            try {
              const url = new URL(form.url.trim());
              if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('protocol');
            } catch {
              return 'Enter a valid http(s) site URL.';
            }
            return '';
          }
        }
      ]
    });
    if (!result) return;

    const { tab, values } = result;
    const name = values.name.trim();

    if (!window.api?.addProvider) {
      alert('Custom providers are available in the Electron desktop app.');
      return;
    }

    // The provider config is persisted by main in userData/providers.json.
    let created;
    try {
      created = tab === 'scrape'
        ? await window.api.addProvider({
            name,
            kind: 'scrape',
            emoji: '🌐',
            url: values.url.trim(),
            inputSelector: values.inputSelector.trim(),
            responseSelector: values.responseSelector.trim(),
            submitAction: 'enter',
            checked: true
          })
        : await window.api.addProvider({
            name,
            kind: 'api',
            emoji: '🧩',
            endpoint: values.endpoint.trim(),
            modelId: values.modelId.trim(),
            checked: true
          });
    } catch (error) {
      alert(`Could not add the provider: ${error.message}`);
      return;
    }

    if (!created?.ok) {
      alert(created?.error || 'Could not add the provider.');
      return;
    }

    // The key goes straight to the encrypted store; CH never sees it.
    if (tab === 'api' && values.apiKey.trim()) {
      try {
        const saved = await window.api.setKey(created.provider.keyRef, values.apiKey.trim());
        if (!saved?.ok) {
          alert(`Provider added, but the API key was not saved: ${saved?.error || 'unknown error'}`);
        }
      } catch (error) {
        alert(`Provider added, but the API key was not saved: ${error.message}`);
      }
    }

    await refreshProviders();
    saveUiPrefs();
  }

  // Helper: Blend cool blue -> warm orange -> glowing gold.
  function heatColor(value) {
    const v = Math.max(1, Math.min(100, Number(value) || 1));
    const lerp = (a, b, t) => Math.round(a + (b - a) * t);
    if (v <= 50) {
      const t = (v - 1) / 49;
      return [lerp(74, 255, t), lerp(158, 154, t), lerp(255, 60, t)];
    }
    const t = (v - 50) / 50;
    return [lerp(255, 255, t), lerp(154, 212, t), lerp(60, 94, t)];
  }

  function applyHeat(row, value) {
    const v = Math.max(1, Math.min(100, Number(value) || 1));
    const [r, g, b] = heatColor(v);
    const t = (v - 1) / 99;
    row.classList.add('heat-row');
    row.style.setProperty('--heat-rgb', `${r}, ${g}, ${b}`);
    row.style.setProperty('--heat-a', (0.04 + 0.20 * t).toFixed(3));
    row.style.setProperty('--heat-border-a', (0.30 + 0.60 * t).toFixed(3));
    row.style.setProperty('--heat-glow', (Math.max(0, (t - 0.7) / 0.3) * 18).toFixed(1));
  }

  // --- STATE FOR LOCKS & MASTER SLIDER ---
  const masterSlider = document.getElementById('masterSlider');
  const masterDelta = document.getElementById('masterDelta');
  const masterLock = document.getElementById('masterLock');

  let masterLocked = false;
  let draggedIdx = null;

  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  function getMasterOffset() {
    return parseInt(masterSlider.value, 10) || 0;
  }

  function syncMasterUI() {
    const offset = getMasterOffset();
    masterDelta.textContent = offset === 0 ? '±0' : (offset > 0 ? `+${offset}` : String(offset));
    masterDelta.classList.toggle('up', offset > 0);
    masterDelta.classList.toggle('down', offset < 0);
  }

  function applyMasterOffset() {
    const offset = getMasterOffset();
    CH.forEach(ch => {
      if (ch.isStatic) return;
      if (masterLocked || !ch.locked) {
        ch.value = clamp(ch.baseValue + offset, 1, 100);
      }
    });
  }

  function commitMasterBaseline() {
    CH.forEach(ch => {
      if (!ch.isStatic) {
        ch.baseValue = ch.value;
        // A committed value is also the new pin for an individually locked model.
        if (ch.locked) ch.lockedValue = ch.value;
      }
    });
    masterSlider.value = '0';
    syncMasterUI();
  }

  function rebaseModel(ch) {
    if (!ch.isStatic) ch.baseValue = clamp(ch.value - getMasterOffset(), 1, 100);
  }

  // --- LEFT BAR RENDERING ---
  // Rows live in a Map keyed by channel id. A row is built once and updated in
  // place on every state change; appendChild() is only used to reorder.
  const leftRows = new Map();
  let leftAddBtn = null;
  let leftOrderKey = '';

  // A channel whose structure changes (static/model, API/scrape, user/built-in)
  // needs a new skeleton; everything else is an in-place update.
  function leftRowSignature(ch) {
    return [
      ch.isStatic ? 'static' : 'model',
      ch.kind || '',
      ch.isUser ? 'user' : 'builtin'
    ].join('|');
  }

  function createLeftRow(ch) {
    const row = document.createElement('div');
    row.className = 'llm-row';
    row.dataset.id = ch.id;
    row.dataset.sig = leftRowSignature(ch);
    row.setAttribute('draggable', 'true');

    if (ch.isStatic) {
      // Brave / Google: checkbox + drag handle only.
      row.innerHTML = `
        <div class="llm-head">
          <span class="grab-handle" title="Drag to reorder">⋮⋮</span>
          <input type="checkbox" aria-label="Enable model">
          <span class="llm-emoji"></span>
          <span class="llm-name"></span>
          <button class="remove-btn" hidden title="Remove provider" aria-label="Remove provider">✕</button>
        </div>
      `;
    } else {
      // Interactive model row: checkbox + handle + slider + lock + prefix.
      row.innerHTML = `
        <div class="llm-head">
          <span class="grab-handle" title="Drag to reorder">⋮⋮</span>
          <input type="checkbox" aria-label="Enable model">
          <span class="llm-emoji"></span>
          <span class="llm-name"></span>
          <span class="model-badge" hidden>API</span>
          <button class="lock-btn" title="Lock model" aria-label="Lock model" aria-pressed="false">🔓</button>
          <button class="remove-btn" hidden title="Remove provider" aria-label="Remove provider">✕</button>
        </div>
        <div class="slider-row">
          <input type="range" min="1" max="100" step="1" value="50" aria-label="Detail level">
        </div>
        <div class="prefix-row">
          <span class="prefix-label">Prefix</span>
          <select class="prefix-select" aria-label="Prefix">
            <option value="Concise">Concise</option>
            <option value="Detailed">Detailed</option>
            <option value="ELI5">ELI5</option>
          </select>
          <button class="prefix-edit-btn" title="Edit custom prefix" aria-label="Edit custom prefix">✏️</button>
        </div>
        <div class="prefix-preview"></div>
      `;
    }

    bindLeftRowEvents(row);
    return row;
  }

  function updateLeftRow(row, ch, index) {
    row._ch = ch;
    row.dataset.id = ch.id;
    row.dataset.index = String(index);
    row.classList.add('llm-row');
    row.classList.toggle('off', !ch.checked);
    row.classList.toggle('static-row', !!ch.isStatic);

    const checkbox = row.querySelector('input[type="checkbox"]');
    if (checkbox.checked !== !!ch.checked) checkbox.checked = !!ch.checked;
    checkbox.setAttribute('aria-label', `Enable ${ch.name}`);

    row.querySelector('.llm-emoji').textContent = ch.emoji;
    row.querySelector('.llm-name').textContent = ch.name;

    const removeBtn = row.querySelector('.remove-btn');
    if (removeBtn) {
      removeBtn.hidden = !ch.isUser;
      removeBtn.setAttribute('aria-label', `Remove ${ch.name}`);
    }

    if (ch.isStatic) return;

    applyHeat(row, ch.value);

    const badge = row.querySelector('.model-badge');
    if (badge) {
      badge.hidden = ch.kind !== 'api';
      if (ch.kind === 'api') badge.title = ch.endpoint || '';
    }

    const lockBtn = row.querySelector('.lock-btn');
    const lockLabel = ch.locked ? 'Unlock model' : 'Lock model';
    lockBtn.classList.toggle('on', !!ch.locked);
    lockBtn.textContent = ch.locked ? '🔒' : '🔓';
    lockBtn.title = lockLabel;
    lockBtn.setAttribute('aria-label', lockLabel);
    lockBtn.setAttribute('aria-pressed', String(!!ch.locked));

    const slider = row.querySelector('input[type="range"]');
    slider.disabled = !masterLocked && !!ch.locked;
    slider.setAttribute('aria-label', `${ch.name} detail level`);
    if (document.activeElement !== slider) slider.value = String(ch.value);

    const select = row.querySelector('.prefix-select');
    let customOption = select.querySelector('option[value="Custom"]');
    if (ch.prefixType === 'Custom' && !customOption) {
      customOption = document.createElement('option');
      customOption.value = 'Custom';
      customOption.textContent = 'Custom';
      select.appendChild(customOption);
    } else if (ch.prefixType !== 'Custom' && customOption) {
      customOption.remove();
    }
    if (select.value !== ch.prefixType) select.value = ch.prefixType;

    const preview = row.querySelector('.prefix-preview');
    const prefixText = getPrefixText(ch);
    const previewText = `↳ ${prefixText}`;
    if (preview.textContent !== previewText) preview.textContent = previewText;
    preview.title = prefixText;
  }

  // Handlers read row._ch at event time: refreshProviders() replaces the CH
  // objects, and a cached row must keep editing the current channel.
  function bindLeftRowEvents(row) {
    // Checkbox state
    const checkbox = row.querySelector('input[type="checkbox"]');
    checkbox.onclick = (e) => e.stopPropagation();
    checkbox.onchange = () => {
      const ch = row._ch;
      if (!ch) return;
      ch.checked = checkbox.checked;
      row.classList.toggle('off', !ch.checked);
      saveUiPrefs();
      updateTimer();
    };

    // Per-model slider. A manual edit becomes the new baseline.
    const slider = row.querySelector('input[type="range"]');
    if (slider) {
      slider.oninput = () => {
        const ch = row._ch;
        if (!ch) return;
        ch.value = parseInt(slider.value, 10);
        commitMasterBaseline();
        applyHeat(row, ch.value);
        saveUiPrefs();
        updateHistory();
        updateTimer();
      };
    }

    // Model lock at the far right of the header row
    const lockBtn = row.querySelector('.lock-btn');
    if (lockBtn) {
      lockBtn.onclick = (e) => {
        e.stopPropagation();
        const ch = row._ch;
        if (!ch) return;
        if (ch.locked) {
          ch.locked = false;
          ch.lockedValue = null;
        } else {
          ch.locked = true;
          ch.lockedValue = ch.value;
        }
        rebaseModel(ch);
        saveUiPrefs();
        renderLeft();
        updateTimer();
      };
    }

    // Prefix preset dropdown
    const prefixSelect = row.querySelector('.prefix-select');
    if (prefixSelect) {
      prefixSelect.onchange = (e) => {
        e.stopPropagation();
        const ch = row._ch;
        if (!ch) return;
        ch.prefixType = prefixSelect.value;
        ch.prefix = getPrefixText(ch);
        saveUiPrefs();
        renderLeft();
      };
    }

    // Pencil -> shared modal -> store the custom string back on CH
    const editBtn = row.querySelector('.prefix-edit-btn');
    if (editBtn) {
      editBtn.onclick = async (e) => {
        e.stopPropagation();
        const ch = row._ch;
        if (!ch) return;
        const current = ch.customPrefix || getPrefixText(ch);
        const values = await showAppModal({
          title: `Custom prefix for ${ch.name}`,
          message: 'This prefix is prepended to your prompt for this model.',
          confirmLabel: 'Use prefix',
          fields: [{ name: 'prefix', label: 'Prefix text', value: current, required: true }]
        });
        if (!values) return;
        ch.customPrefix = values.prefix.trim();
        ch.prefixType = 'Custom';
        ch.prefix = ch.customPrefix;
        saveUiPrefs();
        renderLeft();
      };
    }

    // Interactive controls should not trigger row selection or row drag.
    row.querySelectorAll('input, select, button').forEach(el => {
      el.setAttribute('draggable', 'false');
      el.onmousedown = (e) => e.stopPropagation();
    });

    // User-added providers can be removed; built-ins cannot.
    const removeBtn = row.querySelector('.remove-btn');
    if (removeBtn) {
      removeBtn.onclick = async (e) => {
        e.stopPropagation();
        const ch = row._ch;
        if (!ch) return;
        if (!confirm(`Remove ${ch.name}? You can add it again later.`)) return;
        try {
          const result = await window.api.removeProvider(ch.id);
          if (!result?.ok) {
            alert(result?.error || 'Could not remove the provider.');
            return;
          }
        } catch (error) {
          alert(`Could not remove the provider: ${error.message}`);
          return;
        }
        forgetChannelPrefs(ch.id);
        await refreshProviders();
      };
    }

    // Clicking the row (outside a control/handle) toggles its checkbox.
    row.onclick = (e) => {
      if (e.target.closest('input, select, button, .grab-handle')) return;
      const ch = row._ch;
      if (!ch) return;
      ch.checked = !ch.checked;
      saveUiPrefs();
      renderLeft();
      updateTimer();
    };

    // HTML5 drag-and-drop: dropping on a lower row inserts after it,
    // dropping on a higher row inserts before it. The index is resolved from
    // CH at event time, because rows are cached across reorders.
    row.ondragstart = (e) => {
      if (e.target.closest('input, select, button')) {
        e.preventDefault();
        return;
      }
      const ch = row._ch;
      const index = ch ? CH.findIndex(c => c.id === ch.id) : -1;
      if (index < 0) {
        e.preventDefault();
        return;
      }
      draggedIdx = index;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(index));
      setTimeout(() => row.classList.add('dragging'), 0);
    };

    row.ondragover = (e) => {
      if (draggedIdx === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('drag-over');
    };

    row.ondragleave = () => {
      row.classList.remove('drag-over');
    };

    row.ondrop = (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const from = draggedIdx !== null
        ? draggedIdx
        : parseInt(e.dataTransfer.getData('text/plain'), 10);
      const ch = row._ch;
      const targetIndex = ch ? CH.findIndex(c => c.id === ch.id) : -1;
      if (!Number.isInteger(from) || targetIndex < 0 || from === targetIndex) {
        draggedIdx = null;
        return;
      }
      const [movedItem] = CH.splice(from, 1);
      CH.splice(targetIndex, 0, movedItem);
      draggedIdx = null;
      saveUiPrefs();
      renderLeft();
    };

    row.ondragend = () => {
      draggedIdx = null;
      document.querySelectorAll('.llm-row').forEach(r => {
        r.classList.remove('dragging', 'drag-over');
      });
    };
  }

  function renderLeft() {
    const list = document.getElementById('llmList');
    const seen = new Set();

    CH.forEach((ch, index) => {
      seen.add(ch.id);
      let row = leftRows.get(ch.id);

      // Only a structural change rebuilds a row; text, classes, and attributes
      // are always updated in place so animations survive.
      const signature = leftRowSignature(ch);
      if (row && row.dataset.sig !== signature) {
        row.remove();
        leftRows.delete(ch.id);
        row = null;
      }
      if (!row) {
        row = createLeftRow(ch);
        leftRows.set(ch.id, row);
      }
      updateLeftRow(row, ch, index);
    });

    // Drop rows for providers that no longer exist.
    leftRows.forEach((row, id) => {
      if (seen.has(id)) return;
      row.remove();
      leftRows.delete(id);
    });

    if (!leftAddBtn) {
      leftAddBtn = document.createElement('button');
      leftAddBtn.className = 'add-custom-btn';
      leftAddBtn.textContent = '➕ Add Provider';
      leftAddBtn.title = 'Add a website scraper or an OpenAI-compatible API endpoint';
      leftAddBtn.onclick = addCustomProvider;
    }

    // Reorder only when the id order actually changed. appendChild() moves the
    // cached nodes; no row is recreated.
    const orderKey = CH.map(ch => ch.id).join('\u0000');
    let orderChanged = orderKey !== leftOrderKey || leftAddBtn.parentNode !== list;
    CH.forEach(ch => {
      const row = leftRows.get(ch.id);
      if (row && row.parentNode !== list) orderChanged = true;
    });

    if (orderChanged) {
      CH.forEach(ch => {
        const row = leftRows.get(ch.id);
        if (row) list.appendChild(row);
      });
      list.appendChild(leftAddBtn);
      leftOrderKey = orderKey;
    }
  }

  // --- MASTER LOCK BUTTON ---
  masterLock.onclick = (e) => {
    e.stopPropagation();
    masterLocked = !masterLocked;
    masterLock.classList.toggle('on', masterLocked);
    masterLock.setAttribute('aria-pressed', String(masterLocked));
    masterLock.textContent = masterLocked ? '🔒' : '🔓';
    masterLock.title = masterLocked
      ? 'Master Lock ON: overrides individual locks'
      : 'Master Lock OFF: individual locks respected';
    if (masterLocked) {
      applyMasterOffset();
    } else {
      // Releasing the master lock hands control back to individual locks:
      // restore each locked model to the value it was pinned at.
      CH.forEach(ch => {
        if (!ch.isStatic && ch.locked && ch.lockedValue != null) {
          ch.value = ch.lockedValue;
        }
      });
    }
    saveUiPrefs();
    renderLeft();
    updateTimer();
  };

  // --- MASTER SLIDER: RELATIVE OFFSET, NOT ABSOLUTE VALUE ---
  // Each model keeps its own baseValue. The master slider is an offset in
  // the range -100..+100:
  //   20/50 +10 -> 30/60, then back to 0 -> 20/50 exactly.
  // Individual values clamp at 1/100, but the master offset can keep going
  // until every model has reached the cap.
  masterSlider.oninput = () => {
    applyMasterOffset();
    syncMasterUI();
    saveUiPrefs();
    renderLeft();
    updateHistory();
    updateTimer();
  };

  // --- TRIO TOGGLE (Max heat for DeepSeek, Perplexity, Meta) ---
  const trio = document.getElementById('trioToggle');
  let trioOn = false;
  trio.onclick = () => {
    trioOn = !trioOn;
    trio.classList.toggle('on', trioOn);
    ['deepseek', 'perplexity', 'meta'].forEach(id => {
      const c = CH.find(x => x.id === id);
      if (c && !c.isStatic) {
        c.value = trioOn ? 100 : 50;
        c.baseValue = c.value;
      }
    });
    commitMasterBaseline();
    saveUiPrefs();
    renderLeft();
    updateHistory();
    updateTimer();
  };

  // --- CONVERSATION TREE STATE (T4) ---
  // A conversation is a tree, not a flat array. `activeLeafId` points at the
  // node on screen; the visible conversation is the path from that leaf up to
  // its root, reversed. Branching later only needs to move `activeLeafId`.
  const convo = {
    version: 1,
    nodes: {},
    rootIds: [],
    activeLeafId: null
  };
  let activeTab = 'hybrid';
  const openState = {};

  function newTurnId() {
    // randomUUID needs a secure context. file:// qualifies in Electron, but a
    // fallback keeps the page working in browsers without crypto.randomUUID.
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  // Root -> active leaf, in display order.
  function activePath() {
    const path = [];
    const seen = new Set();
    let id = convo.activeLeafId;
    while (id && convo.nodes[id] && !seen.has(id)) {
      seen.add(id);
      path.push(convo.nodes[id]);
      id = convo.nodes[id].parentId;
    }
    return path.reverse();
  }

  // Create a node and make it the active leaf. The caller supplies `id` on
  // Send so the same turnId travels to main and back with every IPC message.
  function addTurn(parentId, prompt, engine, order, id = newTurnId()) {
    const node = {
      id,
      parentId: parentId || null,
      childIds: [],
      prompt,
      engine,
      replies: {},
      order: [...order],
      hybrid: {
        text: 'Waiting for LLMs...',
        status: 'pending',
        log: '',
        score: 0,
        reason: '',
        sources: [...order],
        omitted: {}
      },
      locked: false,
      createdAt: Date.now()
    };

    convo.nodes[id] = node;
    if (node.parentId && convo.nodes[node.parentId]) {
      convo.nodes[node.parentId].childIds.push(id);
    } else {
      node.parentId = null;
      convo.rootIds.push(id);
    }
    convo.activeLeafId = id;
    return node;
  }

  // Replies are {text, status, ms}. Strings are accepted so a conversation
  // restored from an older shape still renders.
  function replyOf(node, id) {
    const reply = node && node.replies ? node.replies[id] : null;
    if (!reply) return null;
    if (typeof reply === 'string') return { text: reply, status: 'success', ms: 0 };
    return reply;
  }

  // Open state is per node, not per turn number, so branches don't collide.
  const isOpen = (node, id) => !!openState[node.id + ':' + id];
  const setOpen = (node, id, v) => { openState[node.id + ':' + id] = v; };

  function channelsUsed() {
    const used = new Set();
    Object.values(convo.nodes).forEach(t => {
      Object.keys(t.replies || {}).forEach(id => used.add(id));
      if (t.hybrid) {
        (t.hybrid.sources || []).forEach(id => used.add(id));
        Object.keys(t.hybrid.omitted || {}).forEach(id => used.add(id));
      }
    });
    return used;
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    const used = channelsUsed();
    const h = document.createElement('button');
    h.className = 'tab' + (activeTab === 'hybrid' ? ' active' : '');
    h.textContent = HYB;
    h.onclick = () => { activeTab = 'hybrid'; renderAll(); };
    tabs.appendChild(h);

    CH.forEach(ch => {
      if (!used.has(ch.id)) return;
      const b = document.createElement('button');
      b.className = 'tab' + (ch.id === activeTab ? ' active' : '');
      b.textContent = ch.emoji;
      b.title = ch.name;
      b.onclick = () => { activeTab = ch.id; renderAll(); };
      tabs.appendChild(b);
    });
  }

  function scoreClass(pct) { return pct >= 80 ? '' : pct >= 50 ? 'mid' : 'low'; }

  function parseScore(raw) {
    const m = (raw || '').match(/SCORE:\s*(\d+(?:\.\d+)?)\s*\/\s*10/i);
    const r = (raw || '').match(/REASON:\s*(.+?)(?:\n|$)/i);
    return { score: m ? parseFloat(m[1]) : null, reason: r ? r[1].trim() : '' };
  }
  function stripScore(raw) { return (raw || '').replace(/\n*SCORE:[\s\S]*$/i, '').trim(); }

  // --- CONVERSATION RENDERING ---
  // One element per node, cached by turn id. Streaming writes into the cached
  // body; a re-render only updates text/classes/attributes. appendChild() is
  // used to reorder turns, never to rebuild them.
  const turnEls = new Map();
  let convOrderKey = '';

  function createTurnEl(t) {
    const el = document.createElement('div');
    el.className = 'turn';
    el.dataset.turn = t.id;

    const head = document.createElement('div');
    head.className = 'turn-head';

    const tnum = document.createElement('span');
    tnum.className = 'tnum';
    const dot = document.createElement('span');
    dot.textContent = '·';
    const preview = document.createElement('span');
    const ctxTag = document.createElement('span');
    ctxTag.style.color = 'var(--accent)';
    ctxTag.style.fontSize = '13px';
    ctxTag.textContent = '· in context';
    const logBtn = document.createElement('button');
    logBtn.className = 'log-btn';
    logBtn.title = 'Channel log';
    logBtn.textContent = '📜';

    head.append(tnum, dot, preview, ctxTag, logBtn);
    el.appendChild(head);

    const promptCard = document.createElement('div');
    promptCard.className = 'prompt-card';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'You';
    const promptText = document.createElement('span');
    promptCard.append(who, promptText);
    el.appendChild(promptCard);

    const host = document.createElement('div');
    el.appendChild(host);

    el._tnum = tnum;
    el._preview = preview;
    el._ctxTag = ctxTag;
    el._promptText = promptText;
    el._host = host;
    el._mode = null;
    el._card = null;
    return el;
  }

  function buildHybridCard(t) {
    const turnId = t.id;
    const el = document.createElement('div');
    el.className = 'hybrid-card';

    const label = document.createElement('div');
    label.className = 'hybrid-label';
    label.textContent = `${HYB} Hybrid`;

    const body = document.createElement('div');
    body.className = 'hybrid-body';
    body.dataset.kind = 'hybrid';

    const scoreBar = document.createElement('div');
    scoreBar.className = 'score-bar';
    const pct = document.createElement('span');
    pct.className = 'pct';
    const reason = document.createElement('span');
    reason.className = 'reason';
    scoreBar.append(pct, reason);
    scoreBar.onclick = (e) => { e.stopPropagation(); scoreBar.classList.toggle('open'); };

    const sourceBar = document.createElement('div');
    sourceBar.className = 'source-bar';
    const spacer = document.createElement('span');
    spacer.className = 'spacer';

    const sourcesBtn = document.createElement('button');
    sourcesBtn.className = 'bar-act';
    sourcesBtn.dataset.act = 'sources';
    sourcesBtn.textContent = '⊞ View Sources';
    sourcesBtn.onclick = (e) => {
      e.stopPropagation();
      const turn = convo.nodes[turnId];
      if (!turn) return;
      (turn.hybrid.sources || []).forEach(id => setOpen(turn, id, true));
      renderConv();
    };

    const allBtn = document.createElement('button');
    allBtn.className = 'bar-act';
    allBtn.dataset.act = 'all';
    allBtn.textContent = '⊞ Expand All';
    allBtn.onclick = (e) => {
      e.stopPropagation();
      const turn = convo.nodes[turnId];
      if (!turn) return;
      const anyClosed = (turn.order || []).some(id => !isOpen(turn, id));
      (turn.order || []).forEach(id => setOpen(turn, id, anyClosed));
      renderConv();
    };

    sourceBar.append(spacer, sourcesBtn, allBtn);
    el.append(label, body, scoreBar, sourceBar);

    return {
      el,
      turnId,
      mode: 'hybrid',
      label,
      body,
      scoreBar,
      pct,
      reason,
      sourceBar,
      spacer,
      emojiEls: new Map(),
      emojiOrder: '',
      srcEls: new Map(),
      srcOrder: ''
    };
  }

  function buildReplyCard(t) {
    const turnId = t.id;
    const el = document.createElement('div');
    el.className = 'hybrid-card';

    const label = document.createElement('div');
    label.className = 'hybrid-label';

    const body = document.createElement('div');
    body.className = 'hybrid-body';
    body.dataset.kind = 'reply';

    const scoreBar = document.createElement('div');
    scoreBar.className = 'score-bar';
    scoreBar.style.display = 'none';
    const pct = document.createElement('span');
    pct.className = 'pct';
    const reason = document.createElement('span');
    reason.className = 'reason';
    scoreBar.append(pct, reason);
    scoreBar.onclick = (e) => { e.stopPropagation(); scoreBar.classList.toggle('open'); };

    el.append(label, body, scoreBar);

    return { el, turnId, mode: 'reply', label, body, scoreBar, pct, reason };
  }

  function createSourceEl() {
    const el = document.createElement('div');
    el.className = 'src-reply';

    const head = document.createElement('div');
    head.className = 'src-head';
    const name = document.createElement('span');
    const time = document.createElement('span');
    time.className = 'time';
    const pct = document.createElement('span');
    pct.className = 'pct';
    head.append(name, time, pct);

    const text = document.createElement('span');
    const reason = document.createElement('div');
    reason.className = 'src-reason';
    el.append(head, text, reason);

    return { el, name, time, pct, text, reason };
  }

  function updateSourceEl(refs, id, t) {
    let src = refs.srcEls.get(id);
    if (!src) {
      src = createSourceEl();
      refs.srcEls.set(id, src);
    }
    const ch = CH.find(x => x.id === id);
    const reply = replyOf(t, id);
    if (!ch || !reply) return src;

    const raw = reply.text || '';
    const parsed = parseScore(raw);
    const pctValue = parsed.score != null ? Math.round(parsed.score * 10) : null;
    const secs = reply.ms ? (reply.ms / 1000).toFixed(1) + 's' : '';
    const body = stripScore(raw);

    src.el.classList.toggle('open', isOpen(t, id));
    src.name.textContent = `${ch.emoji} ${ch.name}`;
    src.time.textContent = secs;

    if (pctValue != null) {
      src.pct.style.display = '';
      src.pct.className = 'pct ' + scoreClass(pctValue);
      src.pct.textContent = `🎯 ${pctValue}%`;
    } else {
      src.pct.style.display = 'none';
    }

    if (src.text.textContent !== body) src.text.textContent = body;
    src.reason.style.display = parsed.reason ? '' : 'none';
    if (parsed.reason && src.reason.textContent !== parsed.reason) {
      src.reason.textContent = parsed.reason;
    }
    return src;
  }

  function updateHybridCard(refs, t) {
    const hybrid = t.hybrid;
    const text = hybrid.text || '';
    if (refs.body.textContent !== text) refs.body.textContent = text;

    const score = Number(hybrid.score) || 0;
    const open = refs.scoreBar.classList.contains('open');
    refs.scoreBar.className = 'score-bar ' + scoreClass(score) + (open ? ' open' : '');
    refs.scoreBar.style.display = '';
    refs.pct.textContent = `🎯 ${score}%`;
    if (refs.reason.textContent !== (hybrid.reason || '')) {
      refs.reason.textContent = hybrid.reason || '';
    }

    // Source emoji buttons, keyed by channel id.
    const order = (t.order || []).filter(id => CH.some(ch => ch.id === id));
    const wanted = new Set(order);
    refs.emojiEls.forEach((btn, id) => {
      if (wanted.has(id)) return;
      btn.remove();
      refs.emojiEls.delete(id);
    });

    order.forEach(id => {
      const ch = CH.find(x => x.id === id);
      let btn = refs.emojiEls.get(id);
      if (!btn) {
        btn = document.createElement('button');
        btn.className = 'src-emoji';
        btn.dataset.id = id;
        btn.onclick = (e) => {
          e.stopPropagation();
          const turn = convo.nodes[refs.turnId];
          if (!turn) return;
          setOpen(turn, id, !isOpen(turn, id));
          renderConv();
        };
        refs.emojiEls.set(id, btn);
      }
      const omitted = hybrid.omitted && hybrid.omitted[id];
      const isSrc = (hybrid.sources || []).includes(id);
      btn.textContent = ch.emoji;
      btn.className = 'src-emoji'
        + (isOpen(t, id) ? ' on' : '')
        + (omitted || !isSrc ? ' omitted' : '');
      btn.title = ch.name + (omitted ? ' — omitted: ' + omitted : '');
    });

    const emojiOrder = JSON.stringify(order);
    if (emojiOrder !== refs.emojiOrder) {
      order.forEach(id => refs.sourceBar.insertBefore(refs.emojiEls.get(id), refs.spacer));
      refs.emojiOrder = emojiOrder;
    }

    // Expanded source replies, keyed by channel id.
    const sourceIds = order.filter(id => replyOf(t, id));
    const wantedSources = new Set(sourceIds);
    refs.srcEls.forEach((src, id) => {
      if (wantedSources.has(id)) return;
      src.el.remove();
      refs.srcEls.delete(id);
    });
    sourceIds.forEach(id => updateSourceEl(refs, id, t));

    const srcOrder = JSON.stringify(sourceIds);
    if (srcOrder !== refs.srcOrder) {
      sourceIds.forEach(id => {
        const src = refs.srcEls.get(id);
        if (src) refs.el.appendChild(src.el);
      });
      refs.srcOrder = srcOrder;
    }
  }

  function updateReplyCard(refs, t) {
    const reply = replyOf(t, activeTab);
    if (!reply) return;
    const ch = CH.find(c => c.id === activeTab) || {};
    const raw = reply.text || '';
    const parsed = parseScore(raw);
    const pctValue = parsed.score != null ? Math.round(parsed.score * 10) : null;
    const body = stripScore(raw);

    const label = `${ch.emoji || ''} ${ch.name || ''}`.trim();
    if (refs.label.textContent !== label) refs.label.textContent = label;
    if (refs.body.textContent !== body) refs.body.textContent = body;

    if (pctValue == null) {
      refs.scoreBar.style.display = 'none';
      return;
    }
    refs.scoreBar.style.display = '';
    const open = refs.scoreBar.classList.contains('open');
    refs.scoreBar.className = 'score-bar ' + scoreClass(pctValue) + (open ? ' open' : '');
    refs.pct.textContent = `🎯 ${pctValue}%`;
    if (refs.reason.textContent !== (parsed.reason || '')) {
      refs.reason.textContent = parsed.reason || '';
    }
  }

  function updateTurnEl(el, t, index, inCtx) {
    el.classList.toggle('in-ctx', inCtx);
    if (t.locked) el.dataset.locked = '1'; else delete el.dataset.locked;

    el._tnum.textContent = `▶ T${index + 1}`;
    const preview = `${t.prompt.slice(0, 60)}${t.prompt.length > 60 ? '…' : ''}`;
    if (el._preview.textContent !== preview) el._preview.textContent = preview;
    el._ctxTag.hidden = !inCtx;
    if (el._promptText.textContent !== t.prompt) el._promptText.textContent = t.prompt;

    const mode = activeTab === 'hybrid'
      ? (t.hybrid ? 'hybrid' : 'none')
      : (replyOf(t, activeTab) ? 'reply' : 'none');

    if (mode === 'none') {
      if (el._mode !== 'none') {
        el._host.innerHTML = '';
        el._card = null;
        el._mode = 'none';
      }
      return;
    }

    // The turn element survives tab switches; only the card skeleton inside it
    // is rebuilt when the card kind changes.
    if (el._mode !== mode) {
      el._host.innerHTML = '';
      el._card = mode === 'hybrid' ? buildHybridCard(t) : buildReplyCard(t);
      el._host.appendChild(el._card.el);
      el._mode = mode;
    }

    if (mode === 'hybrid') updateHybridCard(el._card, t);
    else updateReplyCard(el._card, t);
  }

  function renderConv() {
    const wrap = document.getElementById('convWrap');
    const depth = parseInt(document.getElementById('hsRange').value, 10) || 0;
    const path = activePath();
    // Context is the last `depth` nodes of the active path.
    const ctxStart = Math.max(0, path.length - depth);
    const seen = new Set();

    path.forEach((t, idx) => {
      seen.add(t.id);
      let el = turnEls.get(t.id);
      if (!el) {
        el = createTurnEl(t);
        turnEls.set(t.id, el);
      }
      updateTurnEl(el, t, idx, idx >= ctxStart);
    });

    // Drop turns that are no longer on the active path.
    turnEls.forEach((el, id) => {
      if (seen.has(id)) return;
      el.remove();
      turnEls.delete(id);
    });

    // Reorder only when the path order changed or an element is not attached.
    const orderKey = JSON.stringify(path.map(t => t.id));
    let orderChanged = orderKey !== convOrderKey || wrap.children.length !== path.length;
    path.forEach(t => {
      const el = turnEls.get(t.id);
      if (el && el.parentNode !== wrap) orderChanged = true;
    });

    if (orderChanged) {
      path.forEach(t => {
        const el = turnEls.get(t.id);
        if (el) wrap.appendChild(el);
      });
      convOrderKey = orderKey;
    }
  }

  // --- HISTORY CONTEXT CALCULATIONS ---
  const hsRange = document.getElementById('hsRange');
  const hsPreview = document.getElementById('hsPreview');
  const hsDepth = document.getElementById('hsDepth');
  const hsTok = document.getElementById('hsTok');
  const hsMeta = document.getElementById('hsMeta');
  const hsNext = document.getElementById('hsNext');

  const est = s => Math.ceil((s || '').length / 4);
  function turnTok(t) {
    let n = est(t.prompt);
    Object.values(t.replies || {}).forEach(r => n += est(typeof r === 'string' ? r : r && r.text));
    if (t.hybrid) n += est(t.hybrid.text);
    return n;
  }
  // History depth is the last `d` nodes of the active path (T4).
  function historyNodes(d) {
    const path = activePath();
    const depth = Math.max(0, Math.min(d || 0, path.length));
    return depth === 0 ? [] : path.slice(path.length - depth);
  }
  function tokUpTo(d) { return historyNodes(d).reduce((s, t) => s + turnTok(t), 0); }

  function updateHistory() {
    const d = parseInt(hsRange.value, 10) || 0;
    const path = activePath();
    const included = historyNodes(d);
    const last = included.length ? included[included.length - 1] : null;

    if (!last) {
      hsPreview.innerHTML = `<strong>0:</strong> fresh — no prior context`;
      hsDepth.textContent = '0 turns';
    } else {
      hsPreview.innerHTML = `<strong>T${path.length}:</strong> "${esc(last.prompt.slice(0, 60))}${last.prompt.length > 60 ? '…' : ''}"`;
      hsDepth.textContent = d + ' turn' + (d === 1 ? '' : 's');
    }
    hsTok.textContent = tokUpTo(d) + ' tok';
    hsMeta.textContent = d === 0 ? `0 of ${path.length} — fresh` : `${d} of ${path.length} in context`;
    hsNext.textContent = '~' + estimateSend().toFixed(1) + 's';
    renderConv();
  }
  hsRange.oninput = updateHistory;

  // --- STATUSBAR TIMINGS & ANIMATION ---
  const sbTimer = document.getElementById('sbTimer');
  const sbStatus = document.getElementById('sbStatus');
  const sbProgress = document.getElementById('sbProgress');
  const sbFill = document.getElementById('sbFill');

  let inflight = null, ticker = null;
  function estimateSend() {
    const depth = parseInt(hsRange.value);
    const ctxTok = tokUpTo(depth);
    const active = CH.filter(c => c.checked);
    let worst = 0;
    active.forEach(c => {
      const budget = c.isStatic ? 1000 : (c.value * 10);
      worst = Math.max(worst, c.ttft + budget / c.tps + ctxTok / 2000);
    });
    return worst;
  }
  function updateTimer() {
    if (inflight) return;
    sbTimer.textContent = `est. next send: ~${estimateSend().toFixed(1)}s`;
    sbTimer.classList.remove('done');
  }
  function startSend() {
    const active = CH.filter(c => c.checked);
    const estSec = estimateSend();
    inflight = { start: Date.now(), est: estSec, total: active.length, left: active.length };
    sbStatus.textContent = `sending to ${active.length}`;
    sbProgress.style.display = 'block';
    if (ticker) clearInterval(ticker);
    ticker = setInterval(tick, 100);
  }
  function tick() {
    if (!inflight) return;
    const elapsed = (Date.now() - inflight.start) / 1000;
    const left = Math.max(0, inflight.est - elapsed);
    sbFill.style.width = Math.min(100, (elapsed / inflight.est) * 100) + '%';
    sbTimer.textContent = left > 0 ? `${left.toFixed(1)}s left` : 'finishing…';
    sbStatus.textContent = `${inflight.total - inflight.left}/${inflight.total} done · ${elapsed.toFixed(1)}s`;
    if (Math.random() < 0.03 && inflight.left > 0) inflight.left--;
    if (inflight.left === 0) {
      clearInterval(ticker); ticker = null;
      sbTimer.classList.add('done');
      sbTimer.textContent = `✓ done in ${elapsed.toFixed(1)}s`;
      sbStatus.textContent = `${inflight.total} replies`;
      setTimeout(() => {
        inflight = null; sbProgress.style.display = 'none';
        sbFill.style.width = '0%'; sbStatus.textContent = 'idle'; updateTimer();
      }, 2600);
    }
  }

  // --- LEGEND DIALOG ---
  const LEGENDS = {
    idle: [
      ['🔒', 'Master Lock / Model Lock: Master overrides individual locks; a model lock freezes that slider.'],
      ['↕', 'Master Slider: Moves every unlocked model relatively; drag back to ±0 to restore.'],
      ['⋮⋮', 'Drag Handle: Reorder models via HTML5 drag-and-drop.'],
      ['✏️', 'Custom Prefix: Edit personalized instructions stored per model.'],
      ['🔥', 'Visual Heat: Row border/glow shifts from cool blue to orange to glowing gold.'],
      ['🌿', 'Branch: Fork conversation into alternative paths.'],
      ['🪟', 'Hybrid Tab: Consolidated synthesized response.']
    ],
    reply: [
      ['🎯', 'Score Bar: Expand the Fidelity Clause rationale.'],
      ['🦁', 'Source Emoji: Inspect that individual raw model output.'],
      ['⊞ View Sources', 'Opens replies contributing to the synthesis.'],
      ['⊞ Expand All', 'Expands/collapses all outputs for the current turn.']
    ],
    summary: [
      ['🆓', 'Summary Bench: Free API summarization pipelines.'],
      ['⚡', 'Groq API'], ['🧠', 'Cerebras'], ['🟩', 'NVIDIA NIM']
    ]
  };

  function setLegendContext(c) {
    document.getElementById('ctxPill').textContent = c;
    document.querySelectorAll('#ctxSwitch button').forEach(b => {
      b.classList.toggle('active', b.dataset.ctx === c);
    });
    document.getElementById('legendBody').innerHTML = (LEGENDS[c] || [])
      .map(([i, t]) => `<div class="legend-item"><span class="ico">${i}</span><span class="txt">${t}</span></div>`)
      .join('');
  }

  document.querySelectorAll('#ctxSwitch button').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); setLegendContext(b.dataset.ctx); };
  });

  const legendPill = document.getElementById('legendPill');
  const legendDrop = document.getElementById('legendDrop');
  legendPill.onclick = (e) => {
    e.stopPropagation();
    legendDrop.classList.toggle('open');
    legendPill.classList.toggle('open');
  };
  document.addEventListener('click', (e) => {
    if (!legendDrop.contains(e.target) && e.target !== legendPill) {
      legendDrop.classList.remove('open'); legendPill.classList.remove('open');
    }
  });

  function renderAll() {
    const count = activePath().length;
    hsRange.max = String(count);
    if ((parseInt(hsRange.value, 10) || 0) > count) hsRange.value = String(count);
    renderTabs();
    renderConv();
  }

  // --- INITIALIZE UI ---
  syncMasterUI();
  setLegendContext('idle');
  // Providers arrive from main; CH is populated and rendered when they land.
  refreshProviders();


  // ==========================================
  // --- ELECTRON APP INTEGRATION ---
  // ==========================================

  // 1. Clear Chat
  window.clearChat = () => {
    convo.nodes = {};
    convo.rootIds = [];
    convo.activeLeafId = null;
    Object.keys(openState).forEach(key => delete openState[key]);
    hsRange.value = '0';
    renderAll();
    updateHistory();
  };

  // 2. Settings: store the DeepSeek key via the encrypted key store
  const settingsBtn = document.getElementById('settingsBtn');
  if (settingsBtn) {
    settingsBtn.onclick = async () => {
      if (!window.api?.hasKey || !window.api?.setKey) {
        alert('Settings are available in the Electron desktop app.');
        return;
      }

      let configured = false;
      try {
        configured = await window.api.hasKey('deepseek');
      } catch {
        // Fall through to the prompt; saving will surface any real error.
      }

      const message = configured
        ? 'A DeepSeek API key is already configured. Enter a new key to replace it.'
        : 'Enter your DeepSeek API key. It is encrypted by the operating system and never stored in the page. An environment variable, if set, takes precedence.';
      const values = await showAppModal({
        title: 'DeepSeek API Key',
        message,
        confirmLabel: 'Save',
        fields: [{
          name: 'key',
          label: 'API key',
          type: 'password',
          placeholder: 'sk-...',
          required: true
        }]
      });
      if (!values) return;

      try {
        const result = await window.api.setKey('deepseek', values.key.trim());
        if (result?.ok) {
          alert('DeepSeek API key saved securely.');
        } else {
          alert(result?.error || 'Could not save the DeepSeek API key.');
        }
      } catch (error) {
        alert(`Could not save the DeepSeek API key: ${error.message}`);
      }
    };
  }

  // 3. Send Button Action
  document.getElementById('sendBtn').onclick = () => {
    const promptText = document.getElementById('masterText').value.trim();
    if (!promptText) return;

    const active = CH.filter(c => c.checked);
    const activeModels = active.map(c => c.id);
    if (activeModels.length === 0) return alert("Select at least one model.");

    const engine = document.getElementById('engineToggle').value;

    // The renderer owns the id: it is created here, stored on the node, and
    // echoed back by main in every IPC payload for this turn.
    const turnId = newTurnId();
    addTurn(convo.activeLeafId, promptText, engine, activeModels, turnId);

    document.getElementById('masterText').value = '';
    renderAll();
    updateTimer();
    startSend();

    if (window.api?.sendPrompt) {
      window.api.sendPrompt({ turnId, promptText, activeModels, engine });
    }
  };

  // 4. LLM Individual Replies via IPC
  // Payloads carry their turnId, so a late reply can never land in a newer
  // turn (B1).
  if (window.api?.onReplyReceived) {
    window.api.onReplyReceived(({ turnId, model, text, status, ms }) => {
      const turn = convo.nodes[turnId];
      if (!turn) return;

      turn.replies[model] = {
        text: text || '',
        status: status || 'success',
        ms: Number(ms) || 0
      };
      if (!turn.order.includes(model)) {
        turn.order.push(model);
      }

      // A locked (finished) turn keeps its synthesized answer.
      if (status !== 'loading' && !turn.locked) {
        turn.hybrid.text = "Synthesizing...";
        turn.hybrid.status = 'synthesizing';
        turn.hybrid.reason = String(turn.engine || '').includes('Cloud')
          ? "Running DeepSeek cloud synthesis..."
          : "Running local OpenVINO model...";
      }
      renderAll();
    });
  }

  // 5. Hybrid Stream via IPC
  if (window.api?.onHybridStream) {
    window.api.onHybridStream(({ turnId, chunk }) => {
      const turn = convo.nodes[turnId];
      if (!turn || !turn.hybrid) return;

      const placeholder = turn.hybrid.text;
      if (placeholder === "Synthesizing..." || placeholder === "Waiting for LLMs...") {
        turn.hybrid.text = "";
      }
      turn.hybrid.text += chunk || '';
      turn.hybrid.status = 'streaming';

      // Target the cached turn element, not "the last .hybrid-body" (B2). The
      // keyed renderer keeps the body alive, so streaming writes are not lost.
      const turnEl = turnEls.get(turnId);
      const hybridBody = turnEl
        ? turnEl.querySelector('.hybrid-body[data-kind="hybrid"]')
        : null;
      if (hybridBody) {
        hybridBody.textContent = turn.hybrid.text;
        const centerPanel = document.querySelector('.center');
        if (centerPanel) centerPanel.scrollTop = centerPanel.scrollHeight;
      }
    });
  }

  // 6. Hybrid Synthesis Complete via IPC
  if (window.api?.onHybridComplete) {
    window.api.onHybridComplete((payload = {}) => {
      const turn = convo.nodes[payload.turnId];
      if (!turn) return;

      turn.hybrid.status = 'complete';
      turn.hybrid.score = 100;
      turn.hybrid.reason = "Synthesis Complete";
      // A completed turn is locked (T4). Its prompt and replies stay put.
      turn.locked = true;

      // Re-render from state so this node's score bar is the one updated.
      renderAll();
    });
  }
</script>
</body>
